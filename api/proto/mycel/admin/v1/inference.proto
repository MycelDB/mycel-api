  mycel.common.v1.InferenceUsageMode usage_mode = 4;
  mycel.common.v1.InferenceUsageStatus status = 5;
  string inference_profile_id = 6;
  string model_endpoint_id = 7;
  string model_id = 8;
  string credential_grant_id = 9;
  string automation_id = 10;
  string automation_run_id = 11;
  string semantic_index_id = 12;
  string actor_principal_id = 13;
  string on_behalf_of_principal_id = 14;
  google.protobuf.Timestamp since = 15;
  google.protobuf.Timestamp until = 16;
  int32 page_size = 17;
  string page_token = 18;
}

message AdminInferenceUsageServiceListUsageEventsResponse {
  repeated InferenceUsageEvent usage_events = 1;
  string next_page_token = 2;
}

message AdminInferenceUsageServiceSummarizeUsageRequest {
  string space_id = 1;
  mycel.common.v1.InferenceScope scope = 2;
  google.protobuf.Timestamp since = 3;
  google.protobuf.Timestamp until = 4;
  repeated string group_by = 5;
}

message AdminInferenceUsageServiceSummarizeUsageResponse {
  repeated InferenceUsageSummary summaries = 1;
}

message InferencePackage {
  string inference_package_id = 1;
  string name = 2;
  string version = 3;
  string source = 4;
  string checksum = 5;
  map<string, int32> definition_counts = 6;
  google.protobuf.Timestamp installed_at = 7;
  string installed_by = 8;
}

message ModelEndpoint {
  string model_endpoint_id = 1;
  string key = 2;
  string name = 3;
  string connector_type = 4;
  string endpoint_url = 5;
  string network_class = 6;
  string privacy_class = 7;
  repeated string auth_modes = 8;
  repeated string operations = 9;
  bool enabled = 10;
  google.protobuf.Struct metadata = 11;
  mycel.common.v1.InferenceNetworkClass network_class_value = 12;
  mycel.common.v1.InferencePrivacyClass privacy_class_value = 13;
  repeated mycel.common.v1.InferenceCredentialAuthType auth_type_values = 14;
  repeated mycel.common.v1.InferenceOperation operation_values = 15;
}

message InferenceModel {
  string model_id = 1;
  string key = 2;
  string operation = 3;
  string model_name = 4;
  repeated string connector_types = 5;
  int32 dimensions = 6;
  string modality = 7;
  string vector_space_key = 8;
  google.protobuf.Struct metadata = 9;
  mycel.common.v1.InferenceOperation operation_value = 10;
  repeated string input_modalities = 11;
  repeated string output_modalities = 12;
  int32 context_tokens = 13;
  int32 max_output_tokens = 14;
  bool enabled = 15;
}

message VectorStore {
  string vector_store_id = 1;
  string key = 2;
  string name = 3;
  string type = 4;
  string privacy_class = 5;
  bool enabled = 6;
  google.protobuf.Struct config = 7;
  mycel.common.v1.InferencePrivacyClass privacy_class_value = 8;
}

message ModelEndpointCapability {
  string model_endpoint_capability_id = 1;
  string model_endpoint_id = 2;
  string model_id = 3;
  string operation = 4;
  bool enabled = 5;
  string model_name_override = 6;
  google.protobuf.Struct metadata = 7;
  mycel.common.v1.InferenceOperation operation_value = 8;
  string capability_key = 9;
  bool supports_json_mode = 10;
  bool supports_tool_calls = 11;
  int32 max_input_tokens = 12;
  int32 max_output_tokens = 13;
  google.protobuf.Struct default_parameters = 14;
}

message ModelEndpointCapabilityDefinition {
  string model_endpoint = 1;
  string model_endpoint_id = 2;
  string model = 3;
  string model_id = 4;
  string operation = 5;
  optional bool enabled = 6;
  string model_name_override = 7;
  google.protobuf.Struct metadata = 8;
}

message InlineSecret {
  string algorithm = 1;
  string nonce_b64 = 2;
  string cipher_b64 = 3;
}

message Secret {
  string secret_id = 1;
  string owner_type = 2;
  string owner_id = 3;
  string kind = 4;
  InlineSecret inline_secret = 5;
  string external_ref = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
}

message InferenceCredential {
  string credential_id = 1;
  string key = 2;
  string display_name = 3;
  string model_endpoint_id = 4;
  string owner_type = 5;
  string owner_id = 6;
  string auth_type = 7;
  string secret_id = 8;
  string status = 9;
  bool is_default = 10;
  google.protobuf.Timestamp create_time = 11;
  google.protobuf.Timestamp update_time = 12;
  google.protobuf.Timestamp last_used_time = 13;
  mycel.common.v1.InferenceCredentialOwnerType owner_type_value = 14;
  mycel.common.v1.InferenceCredentialAuthType auth_type_value = 15;
  mycel.common.v1.InferenceCredentialStatus status_value = 16;
  string secret_version = 17;
  google.protobuf.Timestamp rotated_at = 18;
}

message ProcessingScope {
  string space_id = 1;
  string domain_id = 2;
  string semantic_index_id = 3;
  string node_id = 4;
  bool include_descendants = 5;
}

message InferenceProfile {
  string inference_profile_id = 1;
  string space_id = 2;
  string key = 3;
  string display_name = 4;
  string description = 5;
  mycel.common.v1.InferenceOperation operation = 6;
  string purpose = 7;
  repeated string domain_ids = 8;
  repeated string capability_refs = 9;
  repeated string endpoint_refs = 10;
  repeated string model_refs = 11;
  repeated string required_features = 12;
  mycel.common.v1.InferencePrivacyRequirement privacy_requirement = 13;
  mycel.common.v1.InferenceParameters default_parameters = 14;
  bool enabled = 15;
  string created_by = 16;
  google.protobuf.Timestamp create_time = 17;
  google.protobuf.Timestamp update_time = 18;
  google.protobuf.Struct metadata = 19;
}

message CredentialGrant {
  string credential_grant_id = 1;
  string credential_id = 2;
  ProcessingScope scope = 3;
  repeated string operations = 4;
  string model_endpoint_id = 5;
  string model_id = 6;
  int32 priority = 7;
  bool is_default = 8;
  bool allow_background_use = 9;
  string granted_by = 10;
  google.protobuf.Timestamp create_time = 11;
  google.protobuf.Timestamp expire_time = 12;
  mycel.common.v1.InferenceScope inference_scope = 13;
  repeated mycel.common.v1.InferenceOperation operation_values = 14;
  repeated string inference_profile_ids = 15;
  repeated string model_endpoint_capability_ids = 16;
  repeated mycel.common.v1.InferenceUsageMode usage_modes = 17;
  repeated string grantee_principal_ids = 18;
  repeated string allow_on_behalf_of_principal_ids = 19;
  mycel.common.v1.InferenceGrantState state = 20;
  string revoked_by = 21;
  google.protobuf.Timestamp revoked_at = 22;
  string reason = 23;
}

message InferencePolicy {
  string inference_policy_id = 1;
  ProcessingScope scope = 2;
  string effect = 3;
  repeated string operations = 4;
  bool no_inference = 5;
  repeated string allowed_privacy_classes = 6;
  bool disallow_third_party = 7;
  bool require_local_endpoint = 8;
  string reason = 9;
  string created_by = 10;
  google.protobuf.Timestamp create_time = 11;
  google.protobuf.Timestamp expire_time = 12;
  mycel.common.v1.InferenceScope inference_scope = 13;
  mycel.common.v1.InferencePolicyAction action = 14;
  repeated mycel.common.v1.InferenceOperation operation_values = 15;
  repeated mycel.common.v1.InferencePrivacyClass allowed_privacy_class_values = 16;
  repeated string inference_profile_ids = 17;
  int32 max_input_tokens = 18;
  int32 max_output_tokens = 19;
  int32 max_requests_per_run = 20;
  repeated string data_classes = 21;
  int32 priority = 22;
  mycel.common.v1.InferencePolicyState state = 23;
  string revoked_by = 24;
  google.protobuf.Timestamp revoked_at = 25;
}

message PolicyDecision {
  string policy_decision_id = 1;
  string space_id = 2;
  string domain_id = 3;
  string node_id = 4;
  mycel.common.v1.InferenceOperation operation = 5;
  mycel.common.v1.InferenceUsageMode usage_mode = 6;
  string inference_profile_id = 7;
  string model_endpoint_capability_id = 8;
  string model_endpoint_id = 9;
  string model_id = 10;
  string credential_id = 11;
  string credential_grant_id = 12;
  string actor_principal_id = 13;
  string on_behalf_of_principal_id = 14;
  mycel.common.v1.InferencePolicyDecisionAction action = 15;
  repeated string matched_policy_ids = 16;
  string reason = 17;
  google.protobuf.Timestamp decided_at = 18;
  google.protobuf.Struct metadata = 19;
}

message InferenceUsageEvent {
  string usage_event_id = 1;
  string request_id = 2;
  mycel.common.v1.InferenceOperation operation = 3;
  mycel.common.v1.InferenceUsageMode usage_mode = 4;
  mycel.common.v1.InferenceUsageStatus status = 5;
  string space_id = 6;
  string domain_id = 7;
  string node_id = 8;
  string automation_id = 9;
  string automation_run_id = 10;
  string semantic_index_id = 11;
  string actor_principal_id = 12;
  string on_behalf_of_principal_id = 13;
  string inference_profile_id = 14;
  string model_endpoint_id = 15;
  string model_id = 16;
  string model_endpoint_capability_id = 17;
  string credential_id = 18;
  string credential_grant_id = 19;
  string policy_decision_id = 20;
  string provider_request_id = 21;
  int64 input_tokens = 22;
  int64 output_tokens = 23;
  int64 total_tokens = 24;
  int64 latency_millis = 25;
  string error_code = 26;
  string error_message = 27;
  google.protobuf.Timestamp started_at = 28;
  google.protobuf.Timestamp completed_at = 29;
  google.protobuf.Struct metadata = 30;
}

message InferenceUsageSummary {
  map<string, string> group = 1;
  int64 request_count = 2;
  int64 succeeded_count = 3;
  int64 failed_count = 4;
  int64 denied_count = 5;
  int64 input_tokens = 6;
  int64 output_tokens = 7;
