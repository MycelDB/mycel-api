message AdminInferenceCredentialServiceCreateCredentialRequest {
  string key = 1;
  string display_name = 2;
  string model_endpoint = 3;
  string model_endpoint_id = 4;
  string owner_type = 5;
  string owner_id = 6;
  string auth_type = 7;
