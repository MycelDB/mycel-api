syntax = "proto3";

package mycel.admin.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "mycel/common/v1/inference.proto";


// AdminInferenceCatalogService manages system-level inference catalog resources
// used by semantic indexes, semantic search, and graph automations.
service AdminInferenceCatalogService {
  rpc ApplyInferencePackage(AdminInferenceCatalogServiceApplyInferencePackageRequest) returns (AdminInferenceCatalogServiceApplyInferencePackageResponse);
  rpc ListInferencePackages(AdminInferenceCatalogServiceListInferencePackagesRequest) returns (AdminInferenceCatalogServiceListInferencePackagesResponse);
  rpc ListModelEndpoints(AdminInferenceCatalogServiceListModelEndpointsRequest) returns (AdminInferenceCatalogServiceListModelEndpointsResponse);
  rpc ListModels(AdminInferenceCatalogServiceListModelsRequest) returns (AdminInferenceCatalogServiceListModelsResponse);
  rpc ListVectorStores(AdminInferenceCatalogServiceListVectorStoresRequest) returns (AdminInferenceCatalogServiceListVectorStoresResponse);
  rpc ListModelEndpointCapabilities(AdminInferenceCatalogServiceListModelEndpointCapabilitiesRequest) returns (AdminInferenceCatalogServiceListModelEndpointCapabilitiesResponse);
  rpc SetModelEndpointEnabled(AdminInferenceCatalogServiceSetModelEndpointEnabledRequest) returns (AdminInferenceCatalogServiceSetModelEndpointEnabledResponse);
  rpc SetVectorStoreEnabled(AdminInferenceCatalogServiceSetVectorStoreEnabledRequest) returns (AdminInferenceCatalogServiceSetVectorStoreEnabledResponse);
  rpc SetModelEndpointCapabilityEnabled(AdminInferenceCatalogServiceSetModelEndpointCapabilityEnabledRequest) returns (AdminInferenceCatalogServiceSetModelEndpointCapabilityEnabledResponse);
  rpc DeleteModelEndpoint(AdminInferenceCatalogServiceDeleteModelEndpointRequest) returns (AdminInferenceCatalogServiceDeleteModelEndpointResponse);
  rpc DeleteModel(AdminInferenceCatalogServiceDeleteModelRequest) returns (AdminInferenceCatalogServiceDeleteModelResponse);
  rpc DeleteVectorStore(AdminInferenceCatalogServiceDeleteVectorStoreRequest) returns (AdminInferenceCatalogServiceDeleteVectorStoreResponse);
  rpc DeleteModelEndpointCapability(AdminInferenceCatalogServiceDeleteModelEndpointCapabilityRequest) returns (AdminInferenceCatalogServiceDeleteModelEndpointCapabilityResponse);
}

// AdminInferenceProfileService manages space-scoped inference profiles.
service AdminInferenceProfileService {
  rpc CreateInferenceProfile(AdminInferenceProfileServiceCreateInferenceProfileRequest) returns (AdminInferenceProfileServiceCreateInferenceProfileResponse);
  rpc ListInferenceProfiles(AdminInferenceProfileServiceListInferenceProfilesRequest) returns (AdminInferenceProfileServiceListInferenceProfilesResponse);
  rpc GetInferenceProfile(AdminInferenceProfileServiceGetInferenceProfileRequest) returns (AdminInferenceProfileServiceGetInferenceProfileResponse);
  rpc SetInferenceProfileEnabled(AdminInferenceProfileServiceSetInferenceProfileEnabledRequest) returns (AdminInferenceProfileServiceSetInferenceProfileEnabledResponse);
  rpc DeleteInferenceProfile(AdminInferenceProfileServiceDeleteInferenceProfileRequest) returns (AdminInferenceProfileServiceDeleteInferenceProfileResponse);
}

// AdminInferenceCredentialService manages inference credentials and secret refs.
service AdminInferenceCredentialService {
  rpc CreateCredential(AdminInferenceCredentialServiceCreateCredentialRequest) returns (AdminInferenceCredentialServiceCreateCredentialResponse);
  rpc ListCredentials(AdminInferenceCredentialServiceListCredentialsRequest) returns (AdminInferenceCredentialServiceListCredentialsResponse);
  rpc SetCredentialStatus(AdminInferenceCredentialServiceSetCredentialStatusRequest) returns (AdminInferenceCredentialServiceSetCredentialStatusResponse);
  rpc RotateCredential(AdminInferenceCredentialServiceRotateCredentialRequest) returns (AdminInferenceCredentialServiceRotateCredentialResponse);
  rpc DeleteCredential(AdminInferenceCredentialServiceDeleteCredentialRequest) returns (AdminInferenceCredentialServiceDeleteCredentialResponse);
}

// AdminInferenceGrantService manages credential grants.
service AdminInferenceGrantService {
  rpc CreateCredentialGrant(AdminInferenceGrantServiceCreateCredentialGrantRequest) returns (AdminInferenceGrantServiceCreateCredentialGrantResponse);
  rpc ListCredentialGrants(AdminInferenceGrantServiceListCredentialGrantsRequest) returns (AdminInferenceGrantServiceListCredentialGrantsResponse);
  rpc ExpireCredentialGrant(AdminInferenceGrantServiceExpireCredentialGrantRequest) returns (AdminInferenceGrantServiceExpireCredentialGrantResponse);
  rpc DeleteCredentialGrant(AdminInferenceGrantServiceDeleteCredentialGrantRequest) returns (AdminInferenceGrantServiceDeleteCredentialGrantResponse);
}

// AdminInferencePolicyService manages inference policies and policy decisions.
service AdminInferencePolicyService {
  rpc CreateInferencePolicy(AdminInferencePolicyServiceCreateInferencePolicyRequest) returns (AdminInferencePolicyServiceCreateInferencePolicyResponse);
  rpc ListInferencePolicies(AdminInferencePolicyServiceListInferencePoliciesRequest) returns (AdminInferencePolicyServiceListInferencePoliciesResponse);
  rpc ExpireInferencePolicy(AdminInferencePolicyServiceExpireInferencePolicyRequest) returns (AdminInferencePolicyServiceExpireInferencePolicyResponse);
  rpc DeleteInferencePolicy(AdminInferencePolicyServiceDeleteInferencePolicyRequest) returns (AdminInferencePolicyServiceDeleteInferencePolicyResponse);
  rpc GetPolicyDecision(AdminInferencePolicyServiceGetPolicyDecisionRequest) returns (AdminInferencePolicyServiceGetPolicyDecisionResponse);
}

// AdminInferenceUsageService exposes neutral inference usage telemetry.
service AdminInferenceUsageService {
  rpc ListUsageEvents(AdminInferenceUsageServiceListUsageEventsRequest) returns (AdminInferenceUsageServiceListUsageEventsResponse);
  rpc SummarizeUsage(AdminInferenceUsageServiceSummarizeUsageRequest) returns (AdminInferenceUsageServiceSummarizeUsageResponse);
}

message AdminInferenceCatalogServiceApplyInferencePackageRequest {
  string name = 1;
  string version = 2;
  string source = 3;
  string checksum = 4;
  repeated ModelEndpoint model_endpoints = 5;
  repeated InferenceModel models = 6;
  repeated VectorStore vector_stores = 7;
  repeated ModelEndpointCapabilityDefinition model_endpoint_capabilities = 8;
}

message AdminInferenceCatalogServiceApplyInferencePackageResponse {
  InferencePackage package = 1;
  repeated ModelEndpoint model_endpoints = 2;
  repeated InferenceModel models = 3;
  repeated VectorStore vector_stores = 4;
  repeated ModelEndpointCapability model_endpoint_capabilities = 5;
}

