}

message AdminInferenceGrantServiceCreateCredentialGrantResponse {
  CredentialGrant credential_grant = 1;
}

message AdminInferenceGrantServiceListCredentialGrantsRequest {
  string space_id = 1;
  int32 page_size = 2;
