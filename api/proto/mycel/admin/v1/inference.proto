syntax = "proto3";

package mycel.admin.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "mycel/common/v1/inference.proto";
import "mycel/common/v1/intelligence_access.proto";


// AdminInferenceCatalogService manages system-level model catalog resources used
// by intelligence access profiles, semantic generation rules, semantic search,
// and graph automations.
service AdminInferenceCatalogService {
  rpc ApplyInferencePackage(AdminInferenceCatalogServiceApplyInferencePackageRequest) returns (AdminInferenceCatalogServiceApplyInferencePackageResponse);
  rpc ListInferencePackages(AdminInferenceCatalogServiceListInferencePackagesRequest) returns (AdminInferenceCatalogServiceListInferencePackagesResponse);
  rpc ListModelEndpoints(AdminInferenceCatalogServiceListModelEndpointsRequest) returns (AdminInferenceCatalogServiceListModelEndpointsResponse);
  rpc ListModels(AdminInferenceCatalogServiceListModelsRequest) returns (AdminInferenceCatalogServiceListModelsResponse);
  rpc ListVectorStores(AdminInferenceCatalogServiceListVectorStoresRequest) returns (AdminInferenceCatalogServiceListVectorStoresResponse);
  rpc ListModelEndpointCapabilities(AdminInferenceCatalogServiceListModelEndpointCapabilitiesRequest) returns (AdminInferenceCatalogServiceListModelEndpointCapabilitiesResponse);
  rpc SetModelEndpointEnabled(AdminInferenceCatalogServiceSetModelEndpointEnabledRequest) returns (AdminInferenceCatalogServiceSetModelEndpointEnabledResponse);
  rpc SetVectorStoreEnabled(AdminInferenceCatalogServiceSetVectorStoreEnabledRequest) returns (AdminInferenceCatalogServiceSetVectorStoreEnabledResponse);
  rpc SetModelEndpointCapabilityEnabled(AdminInferenceCatalogServiceSetModelEndpointCapabilityEnabledRequest) returns (AdminInferenceCatalogServiceSetModelEndpointCapabilityEnabledResponse);
  rpc DeleteModelEndpoint(AdminInferenceCatalogServiceDeleteModelEndpointRequest) returns (AdminInferenceCatalogServiceDeleteModelEndpointResponse);
  rpc DeleteModel(AdminInferenceCatalogServiceDeleteModelRequest) returns (AdminInferenceCatalogServiceDeleteModelResponse);
  rpc DeleteVectorStore(AdminInferenceCatalogServiceDeleteVectorStoreRequest) returns (AdminInferenceCatalogServiceDeleteVectorStoreResponse);
  rpc DeleteModelEndpointCapability(AdminInferenceCatalogServiceDeleteModelEndpointCapabilityRequest) returns (AdminInferenceCatalogServiceDeleteModelEndpointCapabilityResponse);
}

message AdminInferenceCatalogServiceApplyInferencePackageRequest {
  string name = 1;
  string version = 2;
  string source = 3;
  string checksum = 4;
  repeated ModelEndpoint model_endpoints = 5;
  repeated InferenceModel models = 6;
  repeated VectorStore vector_stores = 7;
  repeated ModelEndpointCapabilityDefinition model_endpoint_capabilities = 8;
}

message AdminInferenceCatalogServiceApplyInferencePackageResponse {
  InferencePackage package = 1;
  repeated ModelEndpoint model_endpoints = 2;
  repeated InferenceModel models = 3;
  repeated VectorStore vector_stores = 4;
  repeated ModelEndpointCapability model_endpoint_capabilities = 5;
}

message AdminInferenceCatalogServiceListInferencePackagesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message AdminInferenceCatalogServiceListInferencePackagesResponse {
  repeated InferencePackage packages = 1;
  string next_page_token = 2;
}

message AdminInferenceCatalogServiceListModelEndpointsRequest {
  int32 page_size = 1;
  string page_token = 2;
  bool include_disabled = 3;
}

message AdminInferenceCatalogServiceListModelEndpointsResponse {
  repeated ModelEndpoint model_endpoints = 1;
  string next_page_token = 2;
}

message AdminInferenceCatalogServiceListModelsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string kind = 3;
}

message AdminInferenceCatalogServiceListModelsResponse {
  repeated InferenceModel models = 1;
  string next_page_token = 2;
}

message AdminInferenceCatalogServiceListVectorStoresRequest {
  int32 page_size = 1;
  string page_token = 2;
  bool include_disabled = 3;
}

message AdminInferenceCatalogServiceListVectorStoresResponse {
  repeated VectorStore vector_stores = 1;
  string next_page_token = 2;
}

message AdminInferenceCatalogServiceListModelEndpointCapabilitiesRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string model_endpoint_id = 3;
  optional string model_id = 4;
  string operation = 5;
  bool include_disabled = 6;
}

message AdminInferenceCatalogServiceListModelEndpointCapabilitiesResponse {
  repeated ModelEndpointCapability model_endpoint_capabilities = 1;
  string next_page_token = 2;
}

message AdminInferenceCatalogServiceSetModelEndpointEnabledRequest {
  string model_endpoint = 1;
  string model_endpoint_id = 2;
  bool enabled = 3;
}

message AdminInferenceCatalogServiceSetModelEndpointEnabledResponse {
  ModelEndpoint model_endpoint = 1;
}

message AdminInferenceCatalogServiceSetVectorStoreEnabledRequest {
  string vector_store = 1;
  string vector_store_id = 2;
  bool enabled = 3;
}

message AdminInferenceCatalogServiceSetVectorStoreEnabledResponse {
  VectorStore vector_store = 1;
}

message AdminInferenceCatalogServiceSetModelEndpointCapabilityEnabledRequest {
  string model_endpoint_capability_id = 1;
  string model_endpoint = 2;
  string model_endpoint_id = 3;
  string model = 4;
  string model_id = 5;
  string operation = 6;
  bool enabled = 7;
}

message AdminInferenceCatalogServiceSetModelEndpointCapabilityEnabledResponse {
  ModelEndpointCapability model_endpoint_capability = 1;
}

message AdminInferenceCatalogServiceDeleteModelEndpointRequest {
  string model_endpoint = 1;
  string model_endpoint_id = 2;
}

message AdminInferenceCatalogServiceDeleteModelEndpointResponse {
  string model_endpoint_id = 1;
}

message AdminInferenceCatalogServiceDeleteModelRequest {
  string model = 1;
  string model_id = 2;
}

message AdminInferenceCatalogServiceDeleteModelResponse {
  string model_id = 1;
}

message AdminInferenceCatalogServiceDeleteVectorStoreRequest {
  string vector_store = 1;
  string vector_store_id = 2;
}

message AdminInferenceCatalogServiceDeleteVectorStoreResponse {
  string vector_store_id = 1;
}

message AdminInferenceCatalogServiceDeleteModelEndpointCapabilityRequest {
  string model_endpoint_capability_id = 1;
}

message AdminInferenceCatalogServiceDeleteModelEndpointCapabilityResponse {
  string model_endpoint_capability_id = 1;
}

message InferencePackage {
  string inference_package_id = 1;
  string name = 2;
  string version = 3;
  string source = 4;
  string checksum = 5;
  map<string, int32> definition_counts = 6;
  google.protobuf.Timestamp installed_at = 7;
  string installed_by = 8;
}

message ModelEndpoint {
  string model_endpoint_id = 1;
  string key = 2;
  string name = 3;
  string connector_type = 4;
  string endpoint_url = 5;
  string network_class = 6;
  string privacy_class = 7;
  repeated string auth_modes = 8;
  repeated string operations = 9;
  bool enabled = 10;
  google.protobuf.Struct metadata = 11;
  mycel.common.v1.InferenceNetworkClass network_class_value = 12;
  mycel.common.v1.InferencePrivacyClass privacy_class_value = 13;
  repeated mycel.common.v1.IntelligenceAccessCredentialAuthType auth_type_values = 14;
  repeated mycel.common.v1.InferenceOperation operation_values = 15;
}

message InferenceModel {
  string model_id = 1;
  string key = 2;
  string kind = 3;
  string model_name = 4;
  repeated string connector_types = 5;
  int32 dimensions = 6;
  string vector_space_key = 8;
  google.protobuf.Struct metadata = 9;
  mycel.common.v1.InferenceModelKind kind_value = 10;
  repeated string input_modalities = 11;
  repeated string output_modalities = 12;
  int32 context_tokens = 13;
  int32 max_output_tokens = 14;
  bool enabled = 15;
}

message VectorStore {
  string vector_store_id = 1;
  string key = 2;
  string name = 3;
  string type = 4;
  string privacy_class = 5;
  bool enabled = 6;
  google.protobuf.Struct config = 7;
  mycel.common.v1.InferencePrivacyClass privacy_class_value = 8;
}

message ModelEndpointCapability {
  string model_endpoint_capability_id = 1;
  string model_endpoint_id = 2;
  string model_id = 3;
  string operation = 4;
  bool enabled = 5;
  string model_name_override = 6;
  google.protobuf.Struct metadata = 7;
  mycel.common.v1.InferenceOperation operation_value = 8;
  string capability_key = 9;
  bool supports_json_mode = 10;
  bool supports_tool_calls = 11;
  int32 max_input_tokens = 12;
  int32 max_output_tokens = 13;
  google.protobuf.Struct default_parameters = 14;
}

message ModelEndpointCapabilityDefinition {
  string model_endpoint = 1;
  string model_endpoint_id = 2;
  string model = 3;
  string model_id = 4;
  string operation = 5;
  optional bool enabled = 6;
  string model_name_override = 7;
  google.protobuf.Struct metadata = 8;
}
