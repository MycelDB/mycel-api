syntax = "proto3";

package mycel.admin.v1;

import "mycel/client/v1/template.proto";

// AdminTemplateService provides operator-facing read access to space templates.
service AdminTemplateService {
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
}

message ListTemplatesRequest {
  string space_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  bool include_archived = 4;
  bool include_system = 5;
}

message ListTemplatesResponse {
  repeated mycel.client.v1.Template templates = 1;
  string next_page_token = 2;
}

message GetTemplateRequest {
  string space_id = 1;
  string template_id = 2;
}

message GetTemplateResponse {
  mycel.client.v1.Template template = 1;
}
