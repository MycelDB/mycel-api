syntax = "proto3";

package mycel.admin.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// AdminActivityService manages operator-facing activity events.
service AdminActivityService {
  rpc AppendActivityEvent(AppendActivityEventRequest) returns (AppendActivityEventResponse);
  rpc ListActivityEvents(ListActivityEventsRequest) returns (ListActivityEventsResponse);
  rpc GetActivityEvent(GetActivityEventRequest) returns (GetActivityEventResponse);
}

// ActivityEvent is a durable operator-facing event record.
message ActivityEvent {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  google.protobuf.Timestamp ingested_at = 3;
  string severity = 4;
  string category = 5;
  string type = 6;
  string message = 7;
  ActivityEventSource source = 8;
  ActivityEventActor actor = 9;
  ActivityEventResource resource = 10;
  string correlation_id = 11;
  string idempotency_key = 12;
  google.protobuf.Struct metadata = 13;
}

// ActivityEventSource identifies the process, pod, service, or daemon component that emitted an event.
message ActivityEventSource {
  string node_id = 1;
  string node_name = 2;
  string pod_name = 3;
  string component = 4;
  string service = 5;
}

// ActivityEventActor identifies the principal associated with an event.
message ActivityEventActor {
  string principal_id = 1;
  string username = 2;
}

// ActivityEventResource identifies the primary resource associated with an event.
message ActivityEventResource {
  string kind = 1;
  string id = 2;
  string name = 3;
}

message AppendActivityEventRequest {
  ActivityEvent event = 1;
}

message AppendActivityEventResponse {
  ActivityEvent event = 1;
  bool duplicate = 2;
}

message ListActivityEventsRequest {
  google.protobuf.Timestamp since = 1;
  google.protobuf.Timestamp until = 2;
  repeated string severities = 3;
  repeated string categories = 4;
  repeated string types = 5;
  string source_node_id = 6;
  string source_pod_name = 7;
  string source_component = 8;
  string source_service = 9;
  string actor_principal_id = 10;
  string resource_kind = 11;
  string resource_id = 12;
  string correlation_id = 13;
  int32 page_size = 14;
  string page_token = 15;
}

message ListActivityEventsResponse {
  repeated ActivityEvent events = 1;
  string next_page_token = 2;
}

message GetActivityEventRequest {
  string event_id = 1;
}

message GetActivityEventResponse {
  ActivityEvent event = 1;
}
