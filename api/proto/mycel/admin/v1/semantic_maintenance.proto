syntax = "proto3";

package mycel.admin.v1;

import "google/protobuf/timestamp.proto";
import "mycel/admin/v1/semantic.proto";

// AdminSemanticMaintenanceService runs daemon-owned semantic generation rule
// maintenance work. Provider-budget RPCs require CAPABILITY_SEMANTIC_MANAGE
// scoped to request.space_id. An authenticated caller without that grant
// receives PERMISSION_DENIED without disclosure of resource existence.
service AdminSemanticMaintenanceService {
  rpc GetSemanticMaintenanceStatus(GetSemanticMaintenanceStatusRequest) returns (GetSemanticMaintenanceStatusResponse);
  rpc GetSemanticReliabilityStatus(GetSemanticReliabilityStatusRequest) returns (GetSemanticReliabilityStatusResponse);
  // Synchronously starts and executes a full reconciled baseline at a pinned
  // graph revision followed by bounded delta catch-up. Success returns only
  // after state is "completed". Failure returns a non-OK status and normally
  // persists "failed" after an epoch starts. If leadership or durable-state
  // transition fails, the epoch may remain "running" until its owner is fenced;
  // clients must inspect GetSemanticReliabilityStatus after every non-OK
  // result. A concurrent request for the same rule/binding fails with
  // FAILED_PRECONDITION, except that a new leader may fence an abandoned
  // running owner and start a new epoch.
  //
  // This method is not idempotent: every accepted request, including one after
  // a completed or failed rebuild, starts a new rebuild_epoch. After an
  // ambiguous transport outcome, clients must inspect
  // GetSemanticReliabilityStatus before retrying.
  rpc RebuildSemanticRule(RebuildSemanticRuleRequest) returns (RebuildSemanticRuleResponse);
  rpc ListSemanticMaintenanceWork(ListSemanticMaintenanceWorkRequest) returns (ListSemanticMaintenanceWorkResponse);
  rpc RetrySemanticMaintenanceWork(RetrySemanticMaintenanceWorkRequest) returns (RetrySemanticMaintenanceWorkResponse);
  rpc CancelSemanticMaintenanceWork(CancelSemanticMaintenanceWorkRequest) returns (CancelSemanticMaintenanceWorkResponse);
  rpc AnalyzeSemanticDirtyWork(AnalyzeSemanticDirtyWorkRequest) returns (AnalyzeSemanticDirtyWorkResponse);
  rpc ProcessSemanticDirtyWork(ProcessSemanticDirtyWorkRequest) returns (ProcessSemanticDirtyWorkResponse);
  rpc BackfillSemanticRule(BackfillSemanticRuleRequest) returns (BackfillSemanticRuleResponse);

  // Returns authenticated daemon capabilities before a live credential is
  // resolved or persisted. Capabilities describe enforcement, not merely
  // accepted configuration fields.
  rpc GetSemanticProviderBudgetCapabilities(GetSemanticProviderBudgetCapabilitiesRequest) returns (GetSemanticProviderBudgetCapabilitiesResponse);
  // Read-only for either the current rule/binding scope or a retained scope id.
  rpc GetSemanticProviderBudgetStatus(GetSemanticProviderBudgetStatusRequest) returns (GetSemanticProviderBudgetStatusResponse);
  // Discovers current and retained scopes without granting scope mutation.
  rpc ListSemanticProviderBudgetScopes(ListSemanticProviderBudgetScopesRequest) returns (ListSemanticProviderBudgetScopesResponse);
  // Returns append-only attempt transition events for one immutable scope.
  rpc ListSemanticProviderBudgetAttemptEvents(ListSemanticProviderBudgetAttemptEventsRequest) returns (ListSemanticProviderBudgetAttemptEventsResponse);
}

message GetSemanticMaintenanceStatusRequest {
  string space_id = 1;
}

message GetSemanticMaintenanceStatusResponse {
  bool enabled = 1;
  bool degraded = 2;
  string degraded_reason = 3;
  int32 queue_depth_pending = 4;
  int32 queue_depth_running = 5;
  int32 queue_depth_failed_retryable = 6;
  int32 queue_depth_failed_permanent = 7;
  int64 oldest_pending_age_seconds = 8;
  string last_dirty_event_at = 9;
  string last_analyzed_at = 10;
  string last_worker_success_at = 11;
  string last_worker_error_at = 12;
  string throttle_state = 13;
  int32 analyzer_runs = 14;
  int32 worker_runs = 15;
}

message GetSemanticReliabilityStatusRequest {
  string space_id = 1;
  string semantic_rule_id = 2;
  string embedding_binding_key = 3;
}

message GetSemanticReliabilityStatusResponse {
  // Authorization-scoped resource identity; no credential identity is exposed.
  string space_id = 1;
  string semantic_rule_id = 2;
  string embedding_binding_key = 3;
  // Highest committed graph revision observed for this domain.
  uint64 latest_observed_graph_revision = 4;
  // Ingestion cursor only: events through this revision were classified. This
  // field is not a semantic freshness claim.
  uint64 analyzed_through_graph_revision = 5;
  // Highest contiguous revision whose required semantic outcomes completed
  // successfully for semantic_generation. Successful outcomes are a published
  // current record, an applied delete, an explicit policy no-op/skip, or work
  // reconciled by a completed rebuild. Pending, running, retryable/permanent
  // failure, or cancellation never permits this frontier to cross the affected
  // revision.
  //
  // Freshness through revision R is proved only when this field is >= R and
  // the same response has the expected semantic_generation, zero unresolved
  // gaps, capacity_state "ok", degraded false, and rebuild_required false,
  // with rebuild.state neither "required", "running", nor "failed".
  uint64 fresh_through_graph_revision = 6;
  // Bounded unresolved interval diagnostics; these expose no node/source text.
  uint64 unresolved_gap_count = 7;
  uint64 oldest_unresolved_graph_revision = 8;
  uint64 configured_frontier_limit = 9;
  uint64 retained_work_item_count = 10;
  // Generation rotates for incompatible semantic configuration changes. A
  // rotation resets fresh_through_graph_revision and requires a rebuilt
  // baseline for the new generation; values from different generations must
  // never be combined into one freshness claim.
  uint64 semantic_generation = 11;
  // "ok" or "exhausted". Exhaustion is restart-safe, invalidates freshness,
  // and requires rebuild.
  string capacity_state = 12;
  bool degraded = 13;
  // Bounded sanitized operator diagnostic; provider bodies are excluded.
  string degraded_reason = 14;
  bool rebuild_required = 15;
  SemanticRebuildStatus rebuild = 16;
  uint64 configured_gap_interval_limit = 17;
  uint64 configured_revision_span_limit = 18;
  uint64 configured_serialized_byte_limit = 19;
  uint64 retained_gap_interval_count = 20;
  uint64 retained_revision_span = 21;
  uint64 retained_serialized_bytes = 22;
}

message GetSemanticProviderBudgetCapabilitiesRequest {
  string space_id = 1;
}

message GetSemanticProviderBudgetCapabilitiesResponse {
  string contract_version = 1;
  bool daemon_owned_scopes = 2;
  bool pre_provider_attempt_reservation = 3;
  bool durable_restart_recovery = 4;
  bool raft_replicated = 5;
  bool request_limit = 6;
  bool derived_attempt_limit = 7;
  bool aggregate_retry_limit = 8;
  bool per_request_retry_limit = 9;
  bool provider_concurrency_limit = 10;
  bool single_item_batching = 11;
  bool multi_item_batching = 12;
  bool per_request_input_token_limit = 13;
  bool aggregate_input_token_limit = 14;
  bool request_timeout = 15;
  bool total_timeout = 16;
  bool versioned_cost_limit = 17;
  bool conservative_ambiguous_reservations = 18;
  bool append_only_attempt_events = 19;
  repeated string supported_currencies = 20;
  int32 maximum_attempt_event_page_size = 21;
  int32 maximum_scope_page_size = 22;
  bool overage_exhaustion = 23;
}

message SemanticProviderBudgetBindingSelector {
  string semantic_rule_id = 1;
  string embedding_binding_key = 2;
}

message GetSemanticProviderBudgetStatusRequest {
  string space_id = 1;
  oneof selector {
    // Selects a retained immutable scope across rule/binding rollover.
    string budget_scope_id = 2;
    // Selects the current scope only.
    SemanticProviderBudgetBindingSelector current_binding = 3;
  }
}

message GetSemanticProviderBudgetStatusResponse {
  SemanticProviderBudgetStatus status = 1;
}

message SemanticProviderBudgetStatus {
  string space_id = 1;
  string semantic_rule_id = 2;
  string embedding_binding_key = 3;
  string budget_scope_id = 4;
  string correlation_id = 5;
  string model_endpoint_id = 6;
  string model_id = 7;
  string model_endpoint_capability_id = 8;
  SemanticProviderBudgetScopeState state = 9;
  SemanticProviderBudgetPolicy limits = 10;
  SemanticProviderBudgetUsage usage = 11;
  uint64 earliest_retained_event_sequence = 12;
  uint64 high_water_event_sequence = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  google.protobuf.Timestamp expires_at = 16;
  google.protobuf.Timestamp retention_until = 17;
  SemanticProviderBudgetDenialReason denial_reason = 18;
  // Monotonic within a space, never reused, and retained across restart.
  uint64 scope_sequence = 19;
}

message ListSemanticProviderBudgetScopesRequest {
  string space_id = 1;
  // At least correlation_id or semantic_rule_id is required. When both are
  // supplied all filters are conjunctive. embedding_binding_key requires
  // semantic_rule_id.
  string correlation_id = 2;
  string semantic_rule_id = 3;
  string embedding_binding_key = 4;
  int32 page_size = 5;
  // Opaque and bound to principal, space, all filters, and the fixed matching
  // scope set selected by the first page. A continuation supplies page_token
  // and the identical filters; changing filters is INVALID_ARGUMENT.
  string page_token = 6;
}

message ListSemanticProviderBudgetScopesResponse {
  // Strictly ascending by scope_sequence. References are immutable discovery
  // records; retrieve current counters with GetSemanticProviderBudgetStatus.
  // The first page is linearized to a fixed set of matching retained scopes;
  // scopes created later are excluded from every continuation. If retention
  // removes a selected scope between pages, continuation fails with
  // FAILED_PRECONDITION and no partial page. Expired or malformed tokens are
  // INVALID_ARGUMENT. An empty result is not proof that no matching scope ever
  // existed; callers expecting one must fail their reconciliation.
  repeated SemanticProviderBudgetScopeReference scopes = 1;
  string next_page_token = 2;
}

message SemanticProviderBudgetScopeReference {
  uint64 scope_sequence = 1;
  string budget_scope_id = 2;
  string semantic_rule_id = 3;
  string embedding_binding_key = 4;
  string correlation_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp retention_until = 7;
}

message SemanticProviderBudgetUsage {
  // A request is one logical embedding operation with one stable request id.
  // A provider batch is one request regardless of batch_items. The first
  // reservation consumes one request; each reservation consumes one attempt;
  // and every retry_index > 0 also consumes one retry attempt.
  int64 requests = 1;
  int64 attempts = 2;
  int64 retry_attempts = 3;
  int64 batch_items = 4;
  // Includes reserved attempts and terminal attempts with unresolved provider
  // effects, so ambiguity cannot free concurrency.
  int64 active_provider_calls = 5;
  // Token, duration, and cost totals use charged values only when known and no
  // greater than their reservations; otherwise they retain the conservative
  // reserved values. Reserved, expired-reserved, and ambiguous attempts remain
  // counted. Unknown provider effects are never released as unused capacity.
  // A charged overage is counted at its checked actual value, immediately
  // exhausts the scope with ACCOUNTING, and is recorded in its terminal event.
  // Summation overflow saturates the affected counter at int64 max, sets
  // accounting_overflow, exhausts the scope, and prevents later attempts.
  int64 input_tokens = 6;
  int64 provider_millis = 7;
  int64 estimated_cost_micros = 8;
  int64 ambiguous_attempts = 9;
  bool accounting_overflow = 10;
}

enum SemanticProviderBudgetScopeState {
  SEMANTIC_PROVIDER_BUDGET_SCOPE_STATE_UNSPECIFIED = 0;
  SEMANTIC_PROVIDER_BUDGET_SCOPE_STATE_ACTIVE = 1;
  SEMANTIC_PROVIDER_BUDGET_SCOPE_STATE_COMPLETED = 2;
  SEMANTIC_PROVIDER_BUDGET_SCOPE_STATE_EXPIRED = 3;
  SEMANTIC_PROVIDER_BUDGET_SCOPE_STATE_EXHAUSTED = 4;
}

enum SemanticProviderBudgetDenialReason {
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_UNSPECIFIED = 0;
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_NONE = 1;
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_REQUEST_LIMIT = 2;
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_ATTEMPT_LIMIT = 3;
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_RETRY_LIMIT = 4;
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_PER_REQUEST_RETRY_LIMIT = 5;
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_CONCURRENCY_LIMIT = 6;
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_BATCH_LIMIT = 7;
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_INPUT_TOKEN_LIMIT = 8;
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_PROVIDER_TIME_LIMIT = 9;
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_DEADLINE = 10;
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_COST_LIMIT = 11;
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_ROUTE_MISMATCH = 12;
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_ACCOUNTING = 13;
  SEMANTIC_PROVIDER_BUDGET_DENIAL_REASON_CAPACITY = 14;
}

message ListSemanticProviderBudgetAttemptEventsRequest {
  string space_id = 1;
  string budget_scope_id = 2;
  // Optional exclusive sequence. It is mutually exclusive with page_token.
  // retry_index is zero for the original attempt and increases by one for each
  // later attempt with the same request_id.
  uint64 after_sequence = 3;
  // Bounded to maximum_attempt_event_page_size advertised by the daemon.
  int32 page_size = 4;
  // Opaque and bound to principal, space, scope, after_sequence, and the fixed
  // snapshot_high_water_sequence selected by the first page.
  string page_token = 5;
}

message ListSemanticProviderBudgetAttemptEventsResponse {
  // Strictly ascending by event_sequence. Each event is immutable. A provider
  // attempt has exactly one RESERVED event before any provider effect and at
  // most one later terminal event with the same attempt_id and version 2.
  repeated SemanticProviderBudgetAttemptEvent events = 1;
  string next_page_token = 2;
  uint64 earliest_retained_event_sequence = 3;
  // Fixed on the first page and unchanged on every continuation page. Events
  // appended later are excluded; callers start another read after this value.
  uint64 snapshot_high_water_sequence = 4;
  // Current high-water at the response linearization point; it may exceed the
  // snapshot boundary on continuation pages.
  uint64 current_high_water_sequence = 5;
  // True exactly when after_sequence + 1 is less than the earliest retained
  // sequence, including an initial after_sequence of zero. Arithmetic is
  // overflow checked. When no event has ever existed, earliest retained and
  // both high-water values are zero and history_gap is false. When events once
  // existed but all are pruned, earliest retained is zero, current high-water
  // remains non-zero, and history_gap is true exactly when after_sequence is
  // less than snapshot_high_water_sequence. A maximum uint64 after_sequence is
  // INVALID_ARGUMENT. If retention removes a required event
  // between pages, the continuation fails with FAILED_PRECONDITION and returns
  // no partial page. Expired, malformed, or filter-mismatched tokens are
  // INVALID_ARGUMENT. Callers must fail reconciliation on history_gap.
  bool history_gap = 6;
}

message SemanticProviderBudgetAttemptEvent {
  uint64 event_sequence = 1;
  string budget_scope_id = 2;
  // Daemon-generated opaque identities. They must not encode graph identities,
  // source text, credentials, provider request ids, or provider bodies.
  string attempt_id = 3;
  // Exactly 1 for RESERVED and exactly 2 for the optional terminal event.
  uint32 attempt_version = 4;
  string request_id = 5;
  int64 retry_index = 6;
  SemanticProviderBudgetAttemptState state = 7;
  int64 batch_items = 8;
  int64 reserved_input_tokens = 9;
  int64 charged_input_tokens = 10;
  int64 reserved_provider_millis = 11;
  int64 charged_provider_millis = 12;
  int64 reserved_cost_micros = 13;
  int64 charged_cost_micros = 14;
  bool usage_known = 15;
  bool outcome_known = 16;
  bool provider_duration_known = 17;
  SemanticProviderBudgetOutcomeCategory outcome_category = 18;
  google.protobuf.Timestamp recorded_at = 19;
  google.protobuf.Timestamp reserved_until = 20;
  // True only when final cost multiplication or ceiling division exceeded
  // int64. charged_cost_micros is then int64 max, the aggregate cost saturates,
  // accounting_overflow is true, and the scope is exhausted with ACCOUNTING.
  bool charged_cost_saturated = 21;
}

enum SemanticProviderBudgetAttemptState {
  SEMANTIC_PROVIDER_BUDGET_ATTEMPT_STATE_UNSPECIFIED = 0;
  SEMANTIC_PROVIDER_BUDGET_ATTEMPT_STATE_RESERVED = 1;
  SEMANTIC_PROVIDER_BUDGET_ATTEMPT_STATE_SUCCEEDED = 2;
  SEMANTIC_PROVIDER_BUDGET_ATTEMPT_STATE_FAILED = 3;
  SEMANTIC_PROVIDER_BUDGET_ATTEMPT_STATE_CANCELED = 4;
  SEMANTIC_PROVIDER_BUDGET_ATTEMPT_STATE_AMBIGUOUS = 5;
}

enum SemanticProviderBudgetOutcomeCategory {
  SEMANTIC_PROVIDER_BUDGET_OUTCOME_CATEGORY_UNSPECIFIED = 0;
  SEMANTIC_PROVIDER_BUDGET_OUTCOME_CATEGORY_NONE = 1;
  SEMANTIC_PROVIDER_BUDGET_OUTCOME_CATEGORY_SUCCESS = 2;
  SEMANTIC_PROVIDER_BUDGET_OUTCOME_CATEGORY_TRANSIENT_FAILURE = 3;
  SEMANTIC_PROVIDER_BUDGET_OUTCOME_CATEGORY_PERMANENT_FAILURE = 4;
  SEMANTIC_PROVIDER_BUDGET_OUTCOME_CATEGORY_CANCELED_BEFORE_EFFECT = 5;
  SEMANTIC_PROVIDER_BUDGET_OUTCOME_CATEGORY_AMBIGUOUS = 6;
}

message SemanticRebuildStatus {
  // Unique identity for one accepted rebuild invocation. Each accepted request
  // creates a new epoch; clients use it to detect replacement or takeover.
  string rebuild_epoch = 1;
  // Closed value set: empty means no rebuild has been recorded; "required"
  // means the current generation lacks a valid baseline; "running" is
  // non-terminal; "completed" is successful terminal state; and "failed" is
  // unsuccessful terminal state. Unknown values must be treated as not ready.
  string state = 2;
  // Graph revision pinned for the reconciled full baseline.
  uint64 pinned_target_graph_revision = 3;
  // Latest graph revision accounted by delta catch-up. On completed state it
  // reaches at least the latest revision observed before completion.
  uint64 delta_catchup_graph_revision = 4;
  // Generation rebuilt by this epoch. Rebuild itself does not rotate the
  // generation; incompatible configuration changes rotate it before rebuild.
  uint64 semantic_generation = 5;
  // RFC 3339 timestamps. completed_at identifies the most recent successfully
  // completed baseline for this epoch. It may remain populated if a later
  // configuration change or capacity marker changes state from "completed" to
  // "required"; it is not evidence that the current state is completed.
  string started_at = 6;
  string completed_at = 7;
  // Bounded operator-safe failure detail; credentials and provider bodies are
  // excluded.
  string error_message_sanitized = 8;
}

message RebuildSemanticRuleRequest {
  string space_id = 1;
  string semantic_rule_id = 2;
  string embedding_binding_key = 3;
  int32 backfill_limit = 4;
  int32 maintenance_batch_limit = 5;
  int32 max_catchup_iterations = 6;
}

message RebuildSemanticRuleResponse {
  SemanticRebuildStatus rebuild = 1;
  GetSemanticReliabilityStatusResponse reliability = 2;
  int32 selected_count = 3;
  int32 generated_count = 4;
  int32 skipped_count = 5;
  int32 failed_count = 6;
}

message ListSemanticMaintenanceWorkRequest {
  string space_id = 1;
  string status = 2;
  int32 limit = 3;
  string semantic_rule_id = 4;
  string embedding_binding_key = 5;
}

message ListSemanticMaintenanceWorkResponse {
  repeated SemanticMaintenanceWorkItem items = 1;
}

message SemanticMaintenanceWorkItem {
  string work_item_id = 1;
  string space_id = 2;
  string domain_id = 3;
  string semantic_rule_id = 4;
  string embedding_binding_key = 5;
  string target_node_id = 6;
  string action = 7;
  string status = 8;
  int32 attempt_count = 9;
  string not_before = 10;
  string claimed_until = 11;
  string last_error_category = 12;
  string last_error_message_sanitized = 13;
  string created_at = 14;
  string updated_at = 15;
  uint64 first_graph_revision = 16;
  uint64 last_graph_revision = 17;
  uint64 work_generation = 18;
}

message RetrySemanticMaintenanceWorkRequest {
  string space_id = 1;
  string work_item_id = 2;
}

message RetrySemanticMaintenanceWorkResponse {
  SemanticMaintenanceWorkItem item = 1;
}

message CancelSemanticMaintenanceWorkRequest {
  string space_id = 1;
  string work_item_id = 2;
}

message CancelSemanticMaintenanceWorkResponse {
  SemanticMaintenanceWorkItem item = 1;
}

message AnalyzeSemanticDirtyWorkRequest {
  string space_id = 1;
  string semantic_rule_id = 2;
  string embedding_binding_key = 3;
  int32 limit = 4;
}

message AnalyzeSemanticDirtyWorkResponse {
  int32 processed_events = 1;
  int32 enqueued_items = 2;
}

message ProcessSemanticDirtyWorkRequest {
  string space_id = 1;
  int32 limit = 2;
}

message ProcessSemanticDirtyWorkResponse {
  int32 processed_items = 1;
  int32 completed_items = 2;
  int32 failed_items = 3;
}

message BackfillSemanticRuleRequest {
  string space_id = 1;
  string semantic_rule_id = 2;
  string embedding_binding_key = 3;
  repeated string node_ids = 4;
  bool force = 5;
  int32 limit = 6;
  bool continue_on_error = 7;
}

message BackfillSemanticRuleResponse {
  string semantic_rule_id = 1;
  string embedding_binding_key = 2;
  int32 selected_count = 3;
  int32 generated_count = 4;
  int32 skipped_count = 5;
  int32 failed_count = 6;
  repeated BackfillSkipped skipped = 7;
  repeated BackfillFailure failures = 8;
}

message BackfillSkipped {
  string node_id = 1;
  string reason = 2;
}

message BackfillFailure {
  string node_id = 1;
  string error = 2;
}
