syntax = "proto3";

package mycel.admin.v1;


// AdminSemanticMaintenanceService runs daemon-owned semantic generation rule
// maintenance work.
service AdminSemanticMaintenanceService {
  rpc GetSemanticMaintenanceStatus(GetSemanticMaintenanceStatusRequest) returns (GetSemanticMaintenanceStatusResponse);
  rpc ListSemanticMaintenanceWork(ListSemanticMaintenanceWorkRequest) returns (ListSemanticMaintenanceWorkResponse);
  rpc RetrySemanticMaintenanceWork(RetrySemanticMaintenanceWorkRequest) returns (RetrySemanticMaintenanceWorkResponse);
  rpc CancelSemanticMaintenanceWork(CancelSemanticMaintenanceWorkRequest) returns (CancelSemanticMaintenanceWorkResponse);
  rpc AnalyzeSemanticDirtyWork(AnalyzeSemanticDirtyWorkRequest) returns (AnalyzeSemanticDirtyWorkResponse);
  rpc ProcessSemanticDirtyWork(ProcessSemanticDirtyWorkRequest) returns (ProcessSemanticDirtyWorkResponse);
  rpc BackfillSemanticRule(BackfillSemanticRuleRequest) returns (BackfillSemanticRuleResponse);
}

message GetSemanticMaintenanceStatusRequest {
  string space_id = 1;
}

message GetSemanticMaintenanceStatusResponse {
  bool enabled = 1;
  bool degraded = 2;
  string degraded_reason = 3;
  int32 queue_depth_pending = 4;
  int32 queue_depth_running = 5;
  int32 queue_depth_failed_retryable = 6;
  int32 queue_depth_failed_permanent = 7;
  int64 oldest_pending_age_seconds = 8;
  string last_dirty_event_at = 9;
  string last_analyzed_at = 10;
  string last_worker_success_at = 11;
  string last_worker_error_at = 12;
  string throttle_state = 13;
  int32 analyzer_runs = 14;
  int32 worker_runs = 15;
}

message ListSemanticMaintenanceWorkRequest {
  string space_id = 1;
  string status = 2;
  int32 limit = 3;
  string semantic_rule_id = 4;
  string embedding_binding_key = 5;
}

message ListSemanticMaintenanceWorkResponse {
  repeated SemanticMaintenanceWorkItem items = 1;
}

message SemanticMaintenanceWorkItem {
  string work_item_id = 1;
  string space_id = 2;
  string domain_id = 3;
  string semantic_rule_id = 4;
  string embedding_binding_key = 5;
  string target_node_id = 6;
  string action = 7;
  string status = 8;
  int32 attempt_count = 9;
  string not_before = 10;
  string claimed_until = 11;
  string last_error_category = 12;
  string last_error_message_sanitized = 13;
  string created_at = 14;
  string updated_at = 15;
}

message RetrySemanticMaintenanceWorkRequest {
  string space_id = 1;
  string work_item_id = 2;
}

message RetrySemanticMaintenanceWorkResponse {
  SemanticMaintenanceWorkItem item = 1;
}

message CancelSemanticMaintenanceWorkRequest {
  string space_id = 1;
  string work_item_id = 2;
}

message CancelSemanticMaintenanceWorkResponse {
  SemanticMaintenanceWorkItem item = 1;
}

message AnalyzeSemanticDirtyWorkRequest {
  string space_id = 1;
  string semantic_rule_id = 2;
  string embedding_binding_key = 3;
  int32 limit = 4;
}

message AnalyzeSemanticDirtyWorkResponse {
  int32 processed_events = 1;
  int32 enqueued_items = 2;
}

message ProcessSemanticDirtyWorkRequest {
  string space_id = 1;
  int32 limit = 2;
}

message ProcessSemanticDirtyWorkResponse {
  int32 processed_items = 1;
  int32 completed_items = 2;
  int32 failed_items = 3;
}

message BackfillSemanticRuleRequest {
  string space_id = 1;
  string semantic_rule_id = 2;
  string embedding_binding_key = 3;
  repeated string node_ids = 4;
  bool force = 5;
  int32 limit = 6;
  bool continue_on_error = 7;
}

message BackfillSemanticRuleResponse {
  string semantic_rule_id = 1;
  string embedding_binding_key = 2;
  int32 selected_count = 3;
  int32 generated_count = 4;
  int32 skipped_count = 5;
  int32 failed_count = 6;
  repeated BackfillSkipped skipped = 7;
  repeated BackfillFailure failures = 8;
}

message BackfillSkipped {
  string node_id = 1;
  string reason = 2;
}

message BackfillFailure {
  string node_id = 1;
  string error = 2;
}
