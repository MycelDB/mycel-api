syntax = "proto3";

package mycel.admin.v1;

// AdminSemanticMaintenanceService runs daemon-owned semantic generation rule
// maintenance work.
service AdminSemanticMaintenanceService {
  rpc GetSemanticMaintenanceStatus(GetSemanticMaintenanceStatusRequest) returns (GetSemanticMaintenanceStatusResponse);
  rpc GetSemanticReliabilityStatus(GetSemanticReliabilityStatusRequest) returns (GetSemanticReliabilityStatusResponse);
  // Synchronously starts and executes a full reconciled baseline at a pinned
  // graph revision followed by bounded delta catch-up. Success returns only
  // after state is "completed". Failure returns a non-OK status and persists
  // "failed" when the rebuild epoch was started. A concurrent request for the
  // same rule/binding fails with FAILED_PRECONDITION, except that a new leader
  // may fence an abandoned running owner and start a new epoch.
  //
  // This method is not idempotent: every accepted request, including one after
  // a completed or failed rebuild, starts a new rebuild_epoch. After an
  // ambiguous transport outcome, clients must inspect
  // GetSemanticReliabilityStatus before retrying.
  rpc RebuildSemanticRule(RebuildSemanticRuleRequest) returns (RebuildSemanticRuleResponse);
  rpc ListSemanticMaintenanceWork(ListSemanticMaintenanceWorkRequest) returns (ListSemanticMaintenanceWorkResponse);
  rpc RetrySemanticMaintenanceWork(RetrySemanticMaintenanceWorkRequest) returns (RetrySemanticMaintenanceWorkResponse);
  rpc CancelSemanticMaintenanceWork(CancelSemanticMaintenanceWorkRequest) returns (CancelSemanticMaintenanceWorkResponse);
  rpc AnalyzeSemanticDirtyWork(AnalyzeSemanticDirtyWorkRequest) returns (AnalyzeSemanticDirtyWorkResponse);
  rpc ProcessSemanticDirtyWork(ProcessSemanticDirtyWorkRequest) returns (ProcessSemanticDirtyWorkResponse);
  rpc BackfillSemanticRule(BackfillSemanticRuleRequest) returns (BackfillSemanticRuleResponse);
}

message GetSemanticMaintenanceStatusRequest {
  string space_id = 1;
}

message GetSemanticMaintenanceStatusResponse {
  bool enabled = 1;
  bool degraded = 2;
  string degraded_reason = 3;
  int32 queue_depth_pending = 4;
  int32 queue_depth_running = 5;
  int32 queue_depth_failed_retryable = 6;
  int32 queue_depth_failed_permanent = 7;
  int64 oldest_pending_age_seconds = 8;
  string last_dirty_event_at = 9;
  string last_analyzed_at = 10;
  string last_worker_success_at = 11;
  string last_worker_error_at = 12;
  string throttle_state = 13;
  int32 analyzer_runs = 14;
  int32 worker_runs = 15;
}

message GetSemanticReliabilityStatusRequest {
  string space_id = 1;
  string semantic_rule_id = 2;
  string embedding_binding_key = 3;
}

message GetSemanticReliabilityStatusResponse {
  // Authorization-scoped resource identity; no credential identity is exposed.
  string space_id = 1;
  string semantic_rule_id = 2;
  string embedding_binding_key = 3;
  // Highest committed graph revision observed for this domain.
  uint64 latest_observed_graph_revision = 4;
  // Ingestion cursor only: events through this revision were classified. This
  // field is not a semantic freshness claim.
  uint64 analyzed_through_graph_revision = 5;
  // Highest contiguous revision whose required semantic outcomes completed
  // successfully for semantic_generation. Successful outcomes are a published
  // current record, an applied delete, an explicit policy no-op/skip, or work
  // reconciled by a completed rebuild. Pending, running, retryable/permanent
  // failure, or cancellation never permits this frontier to cross the affected
  // revision.
  //
  // Freshness through revision R is proved only when this field is >= R and
  // the same response has the expected semantic_generation, zero unresolved
  // gaps, capacity_state "ok", degraded false, and rebuild_required false,
  // with rebuild.state neither "required", "running", nor "failed".
  uint64 fresh_through_graph_revision = 6;
  // Bounded unresolved interval diagnostics; these expose no node/source text.
  uint64 unresolved_gap_count = 7;
  uint64 oldest_unresolved_graph_revision = 8;
  uint64 configured_frontier_limit = 9;
  uint64 retained_work_item_count = 10;
  // Generation rotates for incompatible semantic configuration changes. A
  // rotation resets fresh_through_graph_revision and requires a rebuilt
  // baseline for the new generation; values from different generations must
  // never be combined into one freshness claim.
  uint64 semantic_generation = 11;
  // "ok" or "exhausted". Exhaustion is restart-safe, invalidates freshness,
  // and requires rebuild.
  string capacity_state = 12;
  bool degraded = 13;
  // Bounded sanitized operator diagnostic; provider bodies are excluded.
  string degraded_reason = 14;
  bool rebuild_required = 15;
  SemanticRebuildStatus rebuild = 16;
  uint64 configured_gap_interval_limit = 17;
  uint64 configured_revision_span_limit = 18;
  uint64 configured_serialized_byte_limit = 19;
  uint64 retained_gap_interval_count = 20;
  uint64 retained_revision_span = 21;
  uint64 retained_serialized_bytes = 22;
}

message SemanticRebuildStatus {
  // Unique identity for one accepted rebuild invocation. Each accepted request
  // creates a new epoch; clients use it to detect replacement or takeover.
  string rebuild_epoch = 1;
  // Closed value set: empty means no rebuild has been recorded; "required"
  // means the current generation lacks a valid baseline; "running" is
  // non-terminal; "completed" is successful terminal state; and "failed" is
  // unsuccessful terminal state. Unknown values must be treated as not ready.
  string state = 2;
  // Graph revision pinned for the reconciled full baseline.
  uint64 pinned_target_graph_revision = 3;
  // Latest graph revision accounted by delta catch-up. On completed state it
  // reaches at least the latest revision observed before completion.
  uint64 delta_catchup_graph_revision = 4;
  // Generation rebuilt by this epoch. Rebuild itself does not rotate the
  // generation; incompatible configuration changes rotate it before rebuild.
  uint64 semantic_generation = 5;
  // RFC 3339 timestamps. completed_at is populated only for completed state.
  string started_at = 6;
  string completed_at = 7;
  // Bounded operator-safe failure detail; credentials and provider bodies are
  // excluded.
  string error_message_sanitized = 8;
}

message RebuildSemanticRuleRequest {
  string space_id = 1;
  string semantic_rule_id = 2;
  string embedding_binding_key = 3;
  int32 backfill_limit = 4;
  int32 maintenance_batch_limit = 5;
  int32 max_catchup_iterations = 6;
}

message RebuildSemanticRuleResponse {
  SemanticRebuildStatus rebuild = 1;
  GetSemanticReliabilityStatusResponse reliability = 2;
  int32 selected_count = 3;
  int32 generated_count = 4;
  int32 skipped_count = 5;
  int32 failed_count = 6;
}

message ListSemanticMaintenanceWorkRequest {
  string space_id = 1;
  string status = 2;
  int32 limit = 3;
  string semantic_rule_id = 4;
  string embedding_binding_key = 5;
}

message ListSemanticMaintenanceWorkResponse {
  repeated SemanticMaintenanceWorkItem items = 1;
}

message SemanticMaintenanceWorkItem {
  string work_item_id = 1;
  string space_id = 2;
  string domain_id = 3;
  string semantic_rule_id = 4;
  string embedding_binding_key = 5;
  string target_node_id = 6;
  string action = 7;
  string status = 8;
  int32 attempt_count = 9;
  string not_before = 10;
  string claimed_until = 11;
  string last_error_category = 12;
  string last_error_message_sanitized = 13;
  string created_at = 14;
  string updated_at = 15;
  uint64 first_graph_revision = 16;
  uint64 last_graph_revision = 17;
  uint64 work_generation = 18;
}

message RetrySemanticMaintenanceWorkRequest {
  string space_id = 1;
  string work_item_id = 2;
}

message RetrySemanticMaintenanceWorkResponse {
  SemanticMaintenanceWorkItem item = 1;
}

message CancelSemanticMaintenanceWorkRequest {
  string space_id = 1;
  string work_item_id = 2;
}

message CancelSemanticMaintenanceWorkResponse {
  SemanticMaintenanceWorkItem item = 1;
}

message AnalyzeSemanticDirtyWorkRequest {
  string space_id = 1;
  string semantic_rule_id = 2;
  string embedding_binding_key = 3;
  int32 limit = 4;
}

message AnalyzeSemanticDirtyWorkResponse {
  int32 processed_events = 1;
  int32 enqueued_items = 2;
}

message ProcessSemanticDirtyWorkRequest {
  string space_id = 1;
  int32 limit = 2;
}

message ProcessSemanticDirtyWorkResponse {
  int32 processed_items = 1;
  int32 completed_items = 2;
  int32 failed_items = 3;
}

message BackfillSemanticRuleRequest {
  string space_id = 1;
  string semantic_rule_id = 2;
  string embedding_binding_key = 3;
  repeated string node_ids = 4;
  bool force = 5;
  int32 limit = 6;
  bool continue_on_error = 7;
}

message BackfillSemanticRuleResponse {
  string semantic_rule_id = 1;
  string embedding_binding_key = 2;
  int32 selected_count = 3;
  int32 generated_count = 4;
  int32 skipped_count = 5;
  int32 failed_count = 6;
  repeated BackfillSkipped skipped = 7;
  repeated BackfillFailure failures = 8;
}

message BackfillSkipped {
  string node_id = 1;
  string reason = 2;
}

message BackfillFailure {
  string node_id = 1;
  string error = 2;
}
