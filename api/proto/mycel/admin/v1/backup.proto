syntax = "proto3";

package mycel.admin.v1;

// AdminBackupService manages daemon backup policy and manual backup runs.
service AdminBackupService {
  rpc GetBackupPolicy(GetBackupPolicyRequest) returns (GetBackupPolicyResponse);
  rpc UpdateBackupPolicy(UpdateBackupPolicyRequest) returns (UpdateBackupPolicyResponse);
  rpc TriggerBackup(TriggerBackupRequest) returns (TriggerBackupResponse);
  rpc GetBackupStatus(GetBackupStatusRequest) returns (GetBackupStatusResponse);
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  rpc DeleteBackup(DeleteBackupRequest) returns (DeleteBackupResponse);
  // StartClusterBackup creates an asynchronous cluster-wide backup operation. Implementations own
  // cluster-safety transitions such as waiting for Raft applied-index convergence before capture.
  rpc StartClusterBackup(StartClusterBackupRequest) returns (StartClusterBackupResponse);
  rpc GetClusterBackupStatus(GetClusterBackupStatusRequest) returns (GetClusterBackupStatusResponse);
  // CancelClusterBackup requests cancellation of a pending or active cluster-wide backup operation.
  // Cancellation is idempotent for terminal operations.
  rpc CancelClusterBackup(CancelClusterBackupRequest) returns (CancelClusterBackupResponse);
  rpc ListClusterBackups(ListClusterBackupsRequest) returns (ListClusterBackupsResponse);
  rpc ValidateClusterBackupSet(ValidateClusterBackupSetRequest) returns (ValidateClusterBackupSetResponse);
}

// BackupArchiveFormat identifies the archive/container format used for a backup.
enum BackupArchiveFormat {
  BACKUP_ARCHIVE_FORMAT_UNSPECIFIED = 0;
  BACKUP_ARCHIVE_FORMAT_ZIP = 1;
  BACKUP_ARCHIVE_FORMAT_TAR = 2;
  BACKUP_ARCHIVE_FORMAT_TAR_GZ = 3;
  BACKUP_ARCHIVE_FORMAT_TAR_ZST = 4;
}

// ClusterBackupState identifies the lifecycle state of an asynchronous cluster backup operation.
enum ClusterBackupState {
  CLUSTER_BACKUP_STATE_UNSPECIFIED = 0;
  CLUSTER_BACKUP_STATE_PENDING = 1;
  CLUSTER_BACKUP_STATE_WAITING_FOR_CLUSTER_CONVERGENCE = 2;
  CLUSTER_BACKUP_STATE_READY = 3;
  CLUSTER_BACKUP_STATE_QUIESCING = 4;
  CLUSTER_BACKUP_STATE_CAPTURING = 5;
  CLUSTER_BACKUP_STATE_VALIDATING = 6;
  CLUSTER_BACKUP_STATE_SUCCEEDED = 7;
  CLUSTER_BACKUP_STATE_FAILED = 8;
  CLUSTER_BACKUP_STATE_CANCELING = 9;
  CLUSTER_BACKUP_STATE_CANCELED = 10;
}

message BackupPolicy {
  bool enabled = 1;
  string backup_dir = 2;
  // Interval schedule period in whole hours. Used when schedule_kind is empty or "interval".
  int32 interval_hours = 3;
  int32 retention_count = 4;
  bool include_logs = 5;
  // Deprecated legacy archive/compression format string, for example "zip".
  string compression = 6 [deprecated = true];
  int64 quiesce_drain_timeout_seconds = 7;
  int64 backup_timeout_seconds = 8;
  int64 retry_after_seconds = 9;
  int32 status_history_limit = 10;
  bool allow_reads_during_backup = 11;
  // Schedule kind: "interval", "daily", or "weekly". Empty means "interval" for compatibility.
  string schedule_kind = 12;
  // Wall-clock time for daily/weekly schedules in HH:MM 24-hour format.
  string time_of_day = 13;
  // IANA timezone for wall-clock schedules, for example "UTC" or "America/Toronto".
  string timezone = 14;
  // Weekdays for weekly schedules, where 0=Sunday through 6=Saturday.
  repeated int32 weekdays = 15;
  // Whether the daemon should run a missed calendar schedule after restart.
  bool run_missed = 16;
  // Archive format. UNSPECIFIED means ZIP for compatibility.
  BackupArchiveFormat archive_format = 17;
}

message BackupStatus {
  string backup_id = 1;
  string state = 2;
  string started_at = 3;
  string completed_at = 4;
  string archive_path = 5;
  string manifest_path = 6;
  string error = 7;
  repeated QuiesceParticipantStatus participants = 8;
  string last_success_at = 9;
  string next_run_at = 10;
}

message BackupSummary {
  string backup_id = 1;
  string archive_name = 2;
  string created_at = 3;
  string completed_at = 4;
  int64 size_bytes = 5;
  string checksum_sha256 = 6;
  // Deprecated legacy archive/compression format string, for example "zip".
  string compression = 7 [deprecated = true];
  bool include_logs = 8;
  BackupArchiveFormat archive_format = 9;
}

message QuiesceStatus {
  repeated QuiesceParticipantStatus participants = 1;
}

message QuiesceParticipantStatus {
  string name = 1;
  bool quiesced = 2;
  int32 active = 3;
  string reason = 4;
  string mode = 5;
  string source = 6;
  string since = 7;
  string last_error = 8;
}

message GetBackupPolicyRequest {}

message GetBackupPolicyResponse {
  BackupPolicy policy = 1;
}

message UpdateBackupPolicyRequest {
  BackupPolicy policy = 1;
}

message UpdateBackupPolicyResponse {
  BackupPolicy policy = 1;
}

message TriggerBackupRequest {
  string reason = 1;
}

message TriggerBackupResponse {
  BackupStatus status = 1;
  BackupSummary backup = 2;
}

message GetBackupStatusRequest {}

message GetBackupStatusResponse {
  BackupStatus status = 1;
  QuiesceStatus quiesce = 2;
}

message ListBackupsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListBackupsResponse {
  repeated BackupSummary backups = 1;
  string next_page_token = 2;
}

message DeleteBackupRequest {
  string backup_id = 1;
}

message DeleteBackupResponse {
  string backup_id = 1;
}

message StartClusterBackupRequest {
  string reason = 1;
  string output_dir = 2;
  BackupArchiveFormat archive_format = 3;
  // Optional client-provided key for idempotent start retries. Servers may return the existing
  // operation for the same key instead of creating a duplicate operation.
  string idempotency_key = 4;
  // Optional maximum time the operation may remain waiting for cluster convergence before failing.
  // Zero means the server default applies.
  int64 convergence_timeout_seconds = 5;
}

message StartClusterBackupResponse {
  ClusterBackupStatus status = 1;
  ClusterBackupSetSummary backup_set = 2;
}

message GetClusterBackupStatusRequest {
  string backup_set_id = 1;
}

message GetClusterBackupStatusResponse {
  ClusterBackupStatus status = 1;
}

message CancelClusterBackupRequest {
  string backup_set_id = 1;
  string reason = 2;
}

message CancelClusterBackupResponse {
  ClusterBackupStatus status = 1;
}

message ListClusterBackupsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListClusterBackupsResponse {
  repeated ClusterBackupSetSummary backup_sets = 1;
  string next_page_token = 2;
}

message ValidateClusterBackupSetRequest {
  string backup_set_path = 1;
}

message ValidateClusterBackupSetResponse {
  bool valid = 1;
  repeated string errors = 2;
  ClusterBackupSetSummary backup_set = 3;
}

message ClusterBackupStatus {
  string backup_set_id = 1;
  string state = 2;
  string cluster_id = 3;
  string reason = 4;
  string created_at = 5;
  string updated_at = 6;
  string completed_at = 7;
  int32 expected_nodes = 8;
  string manifest_uri = 9;
  repeated ClusterBackupNodeArtifact nodes = 10;
  string failed_phase = 11;
  string error = 12;
  map<string, uint64> raft_barriers = 13;
  ClusterBackupState state_code = 14;
  repeated ClusterBackupBlocker blockers = 15;
  bool cancel_requested = 16;
  string current_phase = 17;
  int64 retry_after_seconds = 18;
}

message ClusterBackupBlocker {
  string node_name = 1;
  string node_id = 2;
  uint64 raft_node_id = 3;
  string raft_group = 4;
  string reason = 5;
  uint64 applied_index = 6;
  uint64 commit_index = 7;
  string detail = 8;
}

message ClusterBackupSetSummary {
  string backup_set_id = 1;
  string state = 2;
  string cluster_id = 3;
  string created_at = 4;
  string completed_at = 5;
  int32 expected_nodes = 6;
  string manifest_uri = 7;
  repeated ClusterBackupNodeArtifact nodes = 8;
}

message ClusterBackupNodeArtifact {
  string pod_name = 1;
  string node_id = 2;
  int32 ordinal = 3;
  uint64 raft_node_id = 4;
  string archive_name = 5;
  string archive_uri = 6;
  string manifest_name = 7;
  string manifest_uri = 8;
  int64 size_bytes = 9;
  string checksum_sha256 = 10;
  map<string, uint64> applied_indexes = 11;
}
