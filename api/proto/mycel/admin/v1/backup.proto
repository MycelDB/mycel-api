}

message ListBackupsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListBackupsResponse {
  repeated BackupSummary backups = 1;
  string next_page_token = 2;
}

message DeleteBackupRequest {
  string backup_id = 1;
}

message DeleteBackupResponse {
  string backup_id = 1;
}

message StartClusterBackupRequest {
  string reason = 1;
  string output_dir = 2;
  BackupArchiveFormat archive_format = 3;
  // Optional client-provided key for idempotent start retries. Servers may return the existing
  // operation for the same key instead of creating a duplicate operation.
  string idempotency_key = 4;
  // Optional maximum time the operation may remain waiting for cluster convergence before failing.
  // Zero means the server default applies.
  int64 convergence_timeout_seconds = 5;
  string repository_id = 6;
  BackupCaptureProvider capture_provider = 7;
  ValidationOptions validation_options = 8;
  BackupQuiesceReadProfile quiesce_read_profile = 9;
}

message StartClusterBackupResponse {
  ClusterBackupStatus status = 1;
  ClusterBackupSetSummary backup_set = 2;
}

message GetClusterBackupStatusRequest {
  string backup_set_id = 1;
  string backup_operation_id = 2;
}

message GetClusterBackupStatusResponse {
  ClusterBackupStatus status = 1;
}

message CancelClusterBackupRequest {
  string backup_set_id = 1;
  string reason = 2;
  string backup_operation_id = 3;
}

message CancelClusterBackupResponse {
  ClusterBackupStatus status = 1;
}

message ListClusterBackupsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListClusterBackupsResponse {
  repeated ClusterBackupSetSummary backup_sets = 1;
  string next_page_token = 2;
}

message ListClusterBackupOperationsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListClusterBackupOperationsResponse {
  repeated ClusterBackupStatus operations = 1;
  string next_page_token = 2;
}

message ListClusterBackupSetsRequest {
  string repository_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListClusterBackupSetsResponse {
  repeated ClusterBackupSetSummary backup_sets = 1;
  string next_page_token = 2;
}

message GetClusterBackupSetRequest {
  string repository_id = 1;
  string backup_set_id = 2;
}

message GetClusterBackupSetResponse {
  ClusterBackupSetSummary backup_set = 1;
}

message ValidateClusterBackupSetRequest {
  string backup_set_path = 1;
  string repository_id = 2;
  string backup_set_id = 3;
  ValidationOptions validation_options = 4;
}

message ValidateClusterBackupSetResponse {
  bool valid = 1;
  repeated string errors = 2;
  ClusterBackupSetSummary backup_set = 3;
  ValidationSummary validation = 4;
}

message DeleteClusterBackupSetRequest {
  string repository_id = 1;
  string backup_set_id = 2;
  string reason = 3;
}

message DeleteClusterBackupSetResponse {
  string repository_id = 1;
  string backup_set_id = 2;
  BackupDeletionState state = 3;
}

message PlanRepositoryRetentionRequest {
  string repository_id = 1;
  // Optional override. When omitted, the daemon's effective backup policy retention is used.
  RetentionPolicy retention_policy = 2;
  // Optional RFC3339/RFC3339Nano planning time for deterministic previews and tests.
  string now = 3;
}

message PlanRepositoryRetentionResponse {
  RepositoryRetentionPlan plan = 1;
}

message ApplyRepositoryRetentionRequest {
  string repository_id = 1;
  // Optional override. When omitted, the daemon's effective backup policy retention is used.
  RetentionPolicy retention_policy = 2;
  string reason = 3;
  // Optional RFC3339/RFC3339Nano planning time for deterministic previews and tests.
  string now = 4;
}

message ApplyRepositoryRetentionResponse {
  RepositoryRetentionPlan plan = 1;
}

message RepositoryRetentionPlan {
  string repository_id = 1;
  string planned_at = 2;
  RetentionPolicy retention_policy = 3;
  bool dry_run = 4;
  repeated RepositoryRetentionAction actions = 5;
  repeated string warnings = 6;
  int32 deleted_objects = 7;
}

message RepositoryRetentionAction {
  string backup_set_id = 1;
  string prefix = 2;
  // One of: keep, delete, blocked, delete_incomplete, warn.
  string action = 3;
  string reason = 4;
  string created_at = 5;
  string completed_at = 6;
  int32 object_count = 7;
  int32 deleted_objects = 8;
  bool retryable = 9;
  bool blocked = 10;
  string error = 11;
  string retention_cutoff = 12;
}

message GetBackupObservabilityRequest {
  // Optional repository to probe for retention/incomplete-backup conditions.
  // When empty, the daemon's default repository is used when available.
  string repository_id = 1;
  // Include a dry-run repository retention probe. This may perform object-store
  // list/read operations but never mutates repository contents.
  bool include_retention_probe = 2;
  // Threshold used by stale active operation alert conditions. Defaults to the
  // daemon backup timeout when unset, or 1 hour when no policy timeout exists.
  int64 stale_operation_after_seconds = 3;
  // Threshold used by backup freshness alert conditions. Defaults to twice the
  // backup schedule interval when unset, or 24 hours when no schedule exists.
  int64 backup_freshness_after_seconds = 4;
  // Threshold used by incomplete repository-prefix alerts. Defaults to the
  // effective retention policy's delete-incomplete-after duration when unset.
  int64 incomplete_backup_after_seconds = 5;
}

message GetBackupObservabilityResponse {
  BackupObservabilitySnapshot snapshot = 1;
}

message BackupObservabilitySnapshot {
  string observed_at = 1;
  string repository_id = 2;
  repeated BackupMetric metrics = 3;
  repeated BackupAlertCondition alerts = 4;
  // One of: healthy, warning, critical.
  string summary_state = 5;
}

message BackupMetric {
  // Stable metric name, e.g. mycel_backup_cluster_operation_count.
  string name = 1;
  string description = 2;
  // Unit values are conventional strings such as count, seconds, bytes, or ratio.
  string unit = 3;
  double value = 4;
  // Labels intentionally contain only non-secret identifiers and categories.
  map<string, string> labels = 5;
}

message BackupAlertCondition {
  string name = 1;
  // One of: info, warning, critical.
  string severity = 2;
  bool firing = 3;
  string reason = 4;
  // Prometheus-style expression using metric names from this snapshot.
  string expression = 5;
  // Labels intentionally contain only non-secret identifiers and categories.
  map<string, string> labels = 6;
  repeated string evidence = 7;
}

message ClusterBackupStatus {
  string backup_set_id = 1;
  string state = 2;
  string cluster_id = 3;
  string reason = 4;
  string created_at = 5;
  string updated_at = 6;
  string completed_at = 7;
  int32 expected_nodes = 8;
  string manifest_uri = 9;
  repeated ClusterBackupNodeArtifact nodes = 10;
  string failed_phase = 11;
  string error = 12;
  map<string, uint64> raft_barriers = 13;
  ClusterBackupState state_code = 14;
  repeated ClusterBackupBlocker blockers = 15;
  bool cancel_requested = 16;
  string current_phase = 17;
  int64 retry_after_seconds = 18;
  string repository_id = 19;
  string backup_operation_id = 20;
  repeated CleanupTask cleanup_tasks = 21;
  ValidationSummary validation = 22;
}

message ClusterBackupBlocker {
  string node_name = 1;
  string node_id = 2;
  uint64 raft_node_id = 3;
  string raft_group = 4;
  string reason = 5;
  uint64 applied_index = 6;
  uint64 commit_index = 7;
  string detail = 8;
}

message ClusterBackupSetSummary {
  string backup_set_id = 1;
  string state = 2;
  string cluster_id = 3;
  string created_at = 4;
  string completed_at = 5;
  int32 expected_nodes = 6;
  string manifest_uri = 7;
  repeated ClusterBackupNodeArtifact nodes = 8;
  string repository_id = 9;
  CompatibilitySummary compatibility = 10;
  ValidationSummary validation = 11;
  BackupDeletionState deletion_state = 12;
  BackupRetentionClass retention_class = 13;
  BackupSetManifestSummary manifest = 14;
}

message ClusterBackupNodeArtifact {
  string pod_name = 1;
  string node_id = 2;
  int32 ordinal = 3;
  uint64 raft_node_id = 4;
  string archive_name = 5;
  string archive_uri = 6;
  string manifest_name = 7;
  string manifest_uri = 8;
  int64 size_bytes = 9;
  string checksum_sha256 = 10;
  map<string, uint64> applied_indexes = 11;
}

message PlanClusterRestoreRequest {
  string repository_id = 1;
  string backup_set_id = 2;
  ClusterRestoreTargetMode target_mode = 3;
  ClusterRestoreIdentityMode identity_mode = 4;
  ClusterRestoreAuthSessionPolicy auth_session_policy = 5;
  ValidationOptions validation_options = 6;
  ClusterRestoreTarget target = 7;
  ClusterRestoreStagingLocation staging = 8;
}

message PlanClusterRestoreResponse {
  RestorePlanSummary plan = 1;
}

message StartClusterRestoreRequest {
  string restore_plan_id = 1;
  string repository_id = 2;
  string backup_set_id = 3;
  ClusterRestoreTargetMode target_mode = 4;
  ClusterRestoreIdentityMode identity_mode = 5;
  ClusterRestoreAuthSessionPolicy auth_session_policy = 6;
  string idempotency_key = 7;
  string destructive_confirmation = 8;
  ClusterRestoreTarget target = 9;
  ClusterRestoreStagingLocation staging = 10;
  ClusterRestorePreconditionEvidence preconditions = 11;
  string plan_freshness_token = 12;
}

message StartClusterRestoreResponse {
  ClusterRestoreOperation operation = 1;
}

message GetClusterRestoreStatusRequest {
  string restore_operation_id = 1;
}

message GetClusterRestoreStatusResponse {
  ClusterRestoreOperation operation = 1;
}

message ListClusterRestoresRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListClusterRestoresResponse {
  repeated ClusterRestoreOperation operations = 1;
  string next_page_token = 2;
}

message CancelClusterRestoreRequest {
  string restore_operation_id = 1;
  string reason = 2;
}

message CancelClusterRestoreResponse {
  ClusterRestoreOperation operation = 1;
}
