syntax = "proto3";

package mycel.admin.v1;

// AdminBackupService manages repository-backed backup policy, backup repositories,
// deployment-wide backup operations, backup-set validation, and restore planning/operations.
// A deployment can be a standalone daemon or a clustered installation. External backup
// repositories are the durable backup source of truth; daemon-local filesystem paths are
// not exposed as public backup artifacts.
service AdminBackupService {
  rpc GetBackupPolicy(GetBackupPolicyRequest) returns (GetBackupPolicyResponse);
  rpc UpdateBackupPolicy(UpdateBackupPolicyRequest) returns (UpdateBackupPolicyResponse);

  rpc ListBackupRepositories(ListBackupRepositoriesRequest) returns (ListBackupRepositoriesResponse);
  rpc GetBackupRepository(GetBackupRepositoryRequest) returns (GetBackupRepositoryResponse);
  rpc CreateBackupRepository(CreateBackupRepositoryRequest) returns (CreateBackupRepositoryResponse);
  rpc UpdateBackupRepository(UpdateBackupRepositoryRequest) returns (UpdateBackupRepositoryResponse);
  rpc ValidateBackupRepository(ValidateBackupRepositoryRequest) returns (ValidateBackupRepositoryResponse);
  rpc DeleteBackupRepository(DeleteBackupRepositoryRequest) returns (DeleteBackupRepositoryResponse);

  // StartBackup creates an asynchronous repository-backed deployment backup operation.
  // Standalone deployments are represented as a single-node backup set. Clustered deployments
  // include all authoritative members and any required multi-node convergence evidence.
  // The requested repository is the durable source of truth.
  rpc StartBackup(StartBackupRequest) returns (StartBackupResponse);
  rpc GetBackupOperation(GetBackupOperationRequest) returns (GetBackupOperationResponse);
  // CancelBackupOperation requests cancellation of a pending or active backup operation.
  // Cancellation is idempotent for terminal operations.
  rpc CancelBackupOperation(CancelBackupOperationRequest) returns (CancelBackupOperationResponse);
  rpc ListBackupOperations(ListBackupOperationsRequest) returns (ListBackupOperationsResponse);
  rpc ListBackupSets(ListBackupSetsRequest) returns (ListBackupSetsResponse);
  rpc GetBackupSet(GetBackupSetRequest) returns (GetBackupSetResponse);
  rpc ValidateBackupSet(ValidateBackupSetRequest) returns (ValidateBackupSetResponse);
  rpc DeleteBackupSet(DeleteBackupSetRequest) returns (DeleteBackupSetResponse);
  rpc PlanRepositoryRetention(PlanRepositoryRetentionRequest) returns (PlanRepositoryRetentionResponse);
  rpc ApplyRepositoryRetention(ApplyRepositoryRetentionRequest) returns (ApplyRepositoryRetentionResponse);

  // GetBackupObservability returns a non-secret operator snapshot of backup/restore
  // metrics and alert conditions suitable for external monitoring systems.
  rpc GetBackupObservability(GetBackupObservabilityRequest) returns (GetBackupObservabilityResponse);

  rpc PlanRestore(PlanRestoreRequest) returns (PlanRestoreResponse);
  rpc StartRestore(StartRestoreRequest) returns (StartRestoreResponse);
  rpc GetRestoreOperation(GetRestoreOperationRequest) returns (GetRestoreOperationResponse);
  rpc ListRestoreOperations(ListRestoreOperationsRequest) returns (ListRestoreOperationsResponse);
  rpc CancelRestoreOperation(CancelRestoreOperationRequest) returns (CancelRestoreOperationResponse);
}

// BackupArchiveFormat identifies the archive/container format used for a backup.
enum BackupArchiveFormat {
  BACKUP_ARCHIVE_FORMAT_UNSPECIFIED = 0;
  BACKUP_ARCHIVE_FORMAT_ZIP = 1;
  BACKUP_ARCHIVE_FORMAT_TAR = 2;
  BACKUP_ARCHIVE_FORMAT_TAR_GZ = 3;
  BACKUP_ARCHIVE_FORMAT_TAR_ZST = 4;
}

// BackupRepositoryProvider identifies the external repository implementation.
enum BackupRepositoryProvider {
  BACKUP_REPOSITORY_PROVIDER_UNSPECIFIED = 0;
  BACKUP_REPOSITORY_PROVIDER_S3_COMPATIBLE = 1;
}

// SecretReferenceScheme identifies how a secret or credential is resolved.
enum SecretReferenceScheme {
  SECRET_REFERENCE_SCHEME_UNSPECIFIED = 0;
  SECRET_REFERENCE_SCHEME_AWS_IRSA = 1;
  SECRET_REFERENCE_SCHEME_K8S_SECRET = 2;
  SECRET_REFERENCE_SCHEME_EXTERNAL_SECRET = 3;
  SECRET_REFERENCE_SCHEME_VAULT = 4;
  SECRET_REFERENCE_SCHEME_KMS_KEY = 5;
  SECRET_REFERENCE_SCHEME_TLS_CA = 6;
  SECRET_REFERENCE_SCHEME_ENV = 7;
  SECRET_REFERENCE_SCHEME_FILE_REF = 8;
}

// EncryptionMode identifies the repository encryption policy.
enum EncryptionMode {
  ENCRYPTION_MODE_UNSPECIFIED = 0;
  ENCRYPTION_MODE_SSE_KMS = 1;
  ENCRYPTION_MODE_SSE_S3 = 2;
  ENCRYPTION_MODE_PROVIDER_MANAGED = 3;
  ENCRYPTION_MODE_CLIENT_ENVELOPE = 4;
  ENCRYPTION_MODE_NONE = 5;
}

// BackupValidationState summarizes whether validation evidence is usable.
enum BackupValidationState {
  BACKUP_VALIDATION_STATE_UNSPECIFIED = 0;
  BACKUP_VALIDATION_STATE_NOT_VALIDATED = 1;
  BACKUP_VALIDATION_STATE_VALIDATING = 2;
  BACKUP_VALIDATION_STATE_VALID = 3;
  BACKUP_VALIDATION_STATE_WARNING = 4;
  BACKUP_VALIDATION_STATE_INVALID = 5;
  BACKUP_VALIDATION_STATE_UNSUPPORTED = 6;
}

// BackupRetentionClass controls lifecycle protection for a backup set.
enum BackupRetentionClass {
  BACKUP_RETENTION_CLASS_UNSPECIFIED = 0;
  BACKUP_RETENTION_CLASS_DEFAULT = 1;
  BACKUP_RETENTION_CLASS_PINNED = 2;
  BACKUP_RETENTION_CLASS_EXPIRE_AFTER = 3;
  BACKUP_RETENTION_CLASS_PRE_RESTORE_SAFETY = 4;
}

// BackupCaptureProvider identifies the capture primitive used for backup artifacts.
enum BackupCaptureProvider {
  BACKUP_CAPTURE_PROVIDER_UNSPECIFIED = 0;
  BACKUP_CAPTURE_PROVIDER_AUTO = 1;
  BACKUP_CAPTURE_PROVIDER_FILESYSTEM_IMMUTABLE_COPY = 2;
  BACKUP_CAPTURE_PROVIDER_CSI_VOLUME_SNAPSHOT = 3;
  BACKUP_CAPTURE_PROVIDER_AWS_EBS_SNAPSHOT = 4;
}

// BackupDerivedSubsystem identifies authoritative or derived backup subsystems.
enum BackupDerivedSubsystem {
  BACKUP_DERIVED_SUBSYSTEM_UNSPECIFIED = 0;
  BACKUP_DERIVED_SUBSYSTEM_SEMANTIC_VECTOR_SEARCH = 1;
  BACKUP_DERIVED_SUBSYSTEM_LEXICAL_SEARCH = 2;
  BACKUP_DERIVED_SUBSYSTEM_GRAPH_CHECKPOINT = 3;
  BACKUP_DERIVED_SUBSYSTEM_PERSISTENT_GRAPH_QUERY_INDEX = 4;
  BACKUP_DERIVED_SUBSYSTEM_METADATA_ADJACENCY_MEMORY_INDEX = 5;
}

// BackupDerivedPolicyMode identifies how a derived subsystem is handled.
enum BackupDerivedPolicyMode {
  BACKUP_DERIVED_POLICY_MODE_UNSPECIFIED = 0;
  BACKUP_DERIVED_POLICY_MODE_INCLUDE_REQUIRED = 1;
  BACKUP_DERIVED_POLICY_MODE_INCLUDE_OPTIONAL = 2;
  BACKUP_DERIVED_POLICY_MODE_REBUILD_ALLOWED = 3;
  BACKUP_DERIVED_POLICY_MODE_DISCARD = 4;
}

// BackupQuiesceReadProfile identifies reads allowed while a backup quiesce is held.
enum BackupQuiesceReadProfile {
  BACKUP_QUIESCE_READ_PROFILE_UNSPECIFIED = 0;
  BACKUP_QUIESCE_READ_PROFILE_CONTROL_ONLY = 1;
  BACKUP_QUIESCE_READ_PROFILE_STRICT_READ_ONLY = 2;
}

// BackupDeploymentMode identifies the source or target deployment topology.
enum BackupDeploymentMode {
  BACKUP_DEPLOYMENT_MODE_UNSPECIFIED = 0;
  BACKUP_DEPLOYMENT_MODE_STANDALONE = 1;
  BACKUP_DEPLOYMENT_MODE_CLUSTERED = 2;
}

// BackupOperationState identifies the lifecycle state of an asynchronous backup operation.
enum BackupOperationState {
  BACKUP_OPERATION_STATE_UNSPECIFIED = 0;
  BACKUP_OPERATION_STATE_PENDING = 1;
  BACKUP_OPERATION_STATE_WAITING_FOR_CONVERGENCE = 2;
  BACKUP_OPERATION_STATE_READY = 3;
  BACKUP_OPERATION_STATE_QUIESCING = 4;
  BACKUP_OPERATION_STATE_CAPTURING = 5;
  BACKUP_OPERATION_STATE_VALIDATING = 6;
  BACKUP_OPERATION_STATE_SUCCEEDED = 7;
  BACKUP_OPERATION_STATE_FAILED = 8;
  BACKUP_OPERATION_STATE_CANCELING = 9;
  BACKUP_OPERATION_STATE_CANCELED = 10;
  BACKUP_OPERATION_STATE_PREFLIGHTING = 11;
  BACKUP_OPERATION_STATE_CHECKPOINTING = 12;
  BACKUP_OPERATION_STATE_RELEASING_QUIESCE = 13;
  BACKUP_OPERATION_STATE_UPLOADING = 14;
  BACKUP_OPERATION_STATE_FINALIZING = 15;
}

// RestoreTargetMode identifies the target shape for a restore.
enum RestoreTargetMode {
  RESTORE_TARGET_MODE_UNSPECIFIED = 0;
  RESTORE_TARGET_MODE_NEW_DEPLOYMENT_BOOTSTRAP = 1;
  RESTORE_TARGET_MODE_EXISTING_DEPLOYMENT_REPLACE = 2;
}

// RestoreIdentityMode identifies how restored deployment identity is handled.
enum RestoreIdentityMode {
  RESTORE_IDENTITY_MODE_UNSPECIFIED = 0;
  RESTORE_IDENTITY_MODE_PRESERVE_BACKUP_ID = 1;
  RESTORE_IDENTITY_MODE_ADOPT_TARGET_ID = 2;
  RESTORE_IDENTITY_MODE_GENERATE_NEW_ID = 3;
}

// RestoreAuthSessionPolicy identifies auth-session handling during restore.
enum RestoreAuthSessionPolicy {
  RESTORE_AUTH_SESSION_POLICY_UNSPECIFIED = 0;
  RESTORE_AUTH_SESSION_POLICY_PRESERVE_RESTORED_SESSIONS = 1;
  RESTORE_AUTH_SESSION_POLICY_REVOKE_ALL_SESSIONS = 2;
}

// RestoreOperationState identifies the lifecycle state of a restore operation.
enum RestoreOperationState {
  RESTORE_OPERATION_STATE_UNSPECIFIED = 0;
  RESTORE_OPERATION_STATE_PENDING = 1;
  RESTORE_OPERATION_STATE_PLANNING = 2;
  RESTORE_OPERATION_STATE_VALIDATING_BACKUP_SET = 3;
  RESTORE_OPERATION_STATE_VALIDATING_TARGET = 4;
  RESTORE_OPERATION_STATE_ACQUIRING_RESTORE_LOCK = 5;
  RESTORE_OPERATION_STATE_STAGING_ARTIFACTS = 6;
  RESTORE_OPERATION_STATE_READY_TO_APPLY = 7;
  RESTORE_OPERATION_STATE_PREPARING_TARGET = 8;
  RESTORE_OPERATION_STATE_APPLYING_ARTIFACTS = 9;
  RESTORE_OPERATION_STATE_NORMALIZING_RESTORED_STATE = 10;
  RESTORE_OPERATION_STATE_POST_RESTORE_VALIDATING = 11;
  RESTORE_OPERATION_STATE_RESUMING_SERVICE = 12;
  RESTORE_OPERATION_STATE_SUCCEEDED = 13;
  RESTORE_OPERATION_STATE_CANCELING = 14;
  RESTORE_OPERATION_STATE_CANCELED = 15;
  RESTORE_OPERATION_STATE_FAILED = 16;
  RESTORE_OPERATION_STATE_FAILED_REQUIRES_OPERATOR = 17;
}

// BackupDeletionState identifies backup-set deletion lifecycle state.
enum BackupDeletionState {
  BACKUP_DELETION_STATE_UNSPECIFIED = 0;
  BACKUP_DELETION_STATE_ACTIVE = 1;
  BACKUP_DELETION_STATE_DELETE_REQUESTED = 2;
  BACKUP_DELETION_STATE_DELETING = 3;
  BACKUP_DELETION_STATE_DELETED = 4;
  BACKUP_DELETION_STATE_DELETE_FAILED = 5;
  BACKUP_DELETION_STATE_PROTECTED = 6;
}

message BackupPolicy {
  // Default repository for repository-backed deployment backup operations when an
  // explicit request repository is omitted by server-side policy.
  string default_repository_id = 1;
  // Default capture primitive for repository-backed backup artifacts.
  BackupCaptureProvider capture_provider = 2;
  // Default read profile enforced while repository-backed backups hold quiesce.
  BackupQuiesceReadProfile quiesce_read_profile = 3;
  bool allow_read_only_during_quiesce = 4;
  repeated DerivedSubsystemPolicy derived_subsystems = 5;
  RetentionPolicy retention_policy = 6;
  ValidationOptions validation_options = 7;
}

message SecretReference {
  SecretReferenceScheme scheme = 1;
  string name = 2;
  string namespace = 3;
  string path = 4;
  map<string, string> keys = 5;
  string description = 6;
}

message EncryptionPolicy {
  EncryptionMode mode = 1;
  SecretReference key_ref = 2;
  string kms_key_id = 3;
  bool require_bucket_default_encryption = 4;
}

message S3CompatibleRepositoryConfig {
  string bucket = 1;
  string prefix = 2;
  string region = 3;
  string endpoint_uri = 4;
  bool force_path_style = 5;
  bool disable_tls = 6;
}

message BackupRepository {
  string repository_id = 1;
  string display_name = 2;
  BackupRepositoryProvider provider = 3;
  S3CompatibleRepositoryConfig s3 = 4;
  SecretReference credential_ref = 5;
  EncryptionPolicy encryption = 6;
  SecretReference tls_ca_ref = 7;
  bool dev_only = 8;
  string create_time = 9;
  string update_time = 10;
  BackupRepositoryValidationSummary validation = 11;
}

message BackupRepositoryValidationSummary {
  BackupValidationState state = 1;
  string checked_at = 2;
  repeated ValidationProbeResult probes = 3;
  repeated ValidationBlocker blockers = 4;
  string sanitized_error = 5;
}

message ValidationProbeResult {
  string name = 1;
  BackupValidationState state = 2;
  string detail = 3;
  string checked_at = 4;
}

message ValidationBlocker {
  string reason = 1;
  string detail = 2;
  bool retryable = 3;
  string field_path = 4;
}

message ValidationOptions {
  bool include_artifact_checks = 1;
  bool include_external_dependency_checks = 2;
  bool include_capacity_estimates = 3;
  bool require_complete_marker = 4;
}

message ValidationSummary {
  BackupValidationState state = 1;
  string checked_at = 2;
  repeated ValidationBlocker blockers = 3;
  repeated string warnings = 4;
  string validator_version = 5;
  int32 expected_node_count = 6;
  int32 node_artifact_count = 7;
  int32 required_artifact_count = 8;
  int32 validated_artifact_count = 9;
  int64 total_artifact_bytes = 10;
  string checksum_algorithm = 11;
  repeated string errors = 12;
}

message CompatibilitySummary {
  BackupValidationState state = 1;
  string source_version = 2;
  string daemon_version = 3;
  repeated string required_features = 4;
  repeated ValidationBlocker blockers = 5;
  map<string, string> storage_format_versions = 6;
  string min_restore_mycel_version = 7;
  string max_restore_mycel_version = 8;
  repeated string supported_restore_target_modes = 9;
  repeated string supported_identity_modes = 10;
  bool requires_same_topology = 11;
  bool requires_source_fencing_for_preserved_identity = 12;
}

message CapacityEstimate {
  int64 required_bytes = 1;
  int64 available_bytes = 2;
  repeated ValidationBlocker blockers = 3;
  repeated string warnings = 4;
}

message RetentionPolicy {
  int32 keep_last_successful = 1;
  int64 keep_for_seconds = 2;
  int64 delete_incomplete_after_seconds = 3;
}

message DerivedSubsystemPolicy {
  BackupDerivedSubsystem subsystem = 1;
  BackupDerivedPolicyMode mode = 2;
}

message BackupSetManifestSummary {
  int32 manifest_version = 1;
  string manifest_uri = 2;
  string manifest_checksum_sha256 = 3;
  string complete_marker_uri = 4;
  string complete_marker_checksum_sha256 = 5;
  int64 manifest_size_bytes = 6;
  int64 total_artifact_bytes = 7;
  int32 artifact_count = 8;
}

message CleanupTask {
  string task_id = 1;
  string resource_kind = 2;
  string resource_uri = 3;
  string state = 4;
  string last_error = 5;
}

// RestoreTarget describes the restore destination. For NEW_DEPLOYMENT_BOOTSTRAP,
// callers must identify the standalone or clustered target shape before execution; for
// EXISTING_DEPLOYMENT_REPLACE, the same fields describe the fenced replacement target.
message RestoreTarget {
  string target_deployment_id = 1;
  string target_deployment_name = 2;
  BackupDeploymentMode deployment_mode = 3;
  string namespace = 4;
  string stateful_set = 5;
  int32 expected_node_count = 6;
  repeated RestoreNodeMapping nodes = 7;
  map<string, string> labels = 8;
  map<string, string> annotations = 9;
}

// RestoreNodeMapping binds one backed-up ordinal/artifact to one target data
// location. Restore execution must fail closed when mappings are incomplete or ambiguous.
message RestoreNodeMapping {
  int32 ordinal = 1;
  string source_pod_name = 2;
  string source_node_id = 3;
  string source_archive_uri = 4;
  string target_pod_name = 5;
  string target_node_name = 6;
  string target_pvc_name = 7;
  string target_data_dir = 8;
  string staging_path = 9;
}

// RestoreStagingLocation describes where repository artifacts may be downloaded
// and verified before being applied to target data dirs/PVCs.
message RestoreStagingLocation {
  string staging_uri = 1;
  string storage_class = 2;
  int64 required_bytes = 3;
  int64 available_bytes = 4;
  bool clean_before_use = 5;
  repeated ValidationBlocker blockers = 6;
}

// RestoreCleanTargetProof records evidence that a NEW_DEPLOYMENT_BOOTSTRAP target
// is empty/safe to receive physical backup artifacts.
message RestoreCleanTargetProof {
  string proof_id = 1;
  string checked_at = 2;
  bool target_empty = 3;
  repeated RestoreNodeMapping checked_nodes = 4;
  repeated ValidationBlocker blockers = 5;
  string operator_attestation = 6;
}

// RestoreSourceFencingEvidence records proof that preserved-identity restores
// cannot race with the original source deployment.
message RestoreSourceFencingEvidence {
  bool source_deployment_fenced = 1;
  string fenced_at = 2;
  string fence_token_ref = 3;
  repeated string fenced_endpoints = 4;
  repeated ValidationBlocker blockers = 5;
}

// RestorePreconditionEvidence groups execution safety proofs supplied with a
// restore start request or reported back on an operation.
message RestorePreconditionEvidence {
  RestoreCleanTargetProof clean_target = 1;
  RestoreSourceFencingEvidence source_fencing = 2;
  repeated ValidationBlocker blockers = 3;
}

message RestoreNodeProgress {
  int32 ordinal = 1;
  string state = 2;
  string source_archive_uri = 3;
  string staging_uri = 4;
  int64 bytes_total = 5;
  int64 bytes_completed = 6;
  string checksum_sha256 = 7;
  string last_error = 8;
  map<string, string> evidence = 9;
}

message RestoreProgress {
  int32 total_nodes = 1;
  int32 staged_nodes = 2;
  int32 applied_nodes = 3;
  int32 verified_nodes = 4;
  int64 bytes_total = 5;
  int64 bytes_completed = 6;
  string current_phase = 7;
  string current_node = 8;
  repeated RestoreNodeProgress nodes = 9;
}

message RestorePlanSummary {
  string restore_plan_id = 1;
  string repository_id = 2;
  string backup_set_id = 3;
  RestoreTargetMode target_mode = 4;
  RestoreIdentityMode identity_mode = 5;
  RestoreAuthSessionPolicy auth_session_policy = 6;
  bool restorable = 7;
  ValidationSummary validation = 8;
  CompatibilitySummary compatibility = 9;
  CapacityEstimate capacity = 10;
  repeated DerivedSubsystemPolicy derived_actions = 11;
  repeated ValidationBlocker blockers = 12;
  string planned_at = 13;
  RestoreTarget target = 14;
  RestoreStagingLocation staging = 15;
  RestorePreconditionEvidence required_preconditions = 16;
}

message RestoreOperation {
  string restore_operation_id = 1;
  string restore_plan_id = 2;
  string repository_id = 3;
  string backup_set_id = 4;
  RestoreOperationState state = 5;
  RestoreTargetMode target_mode = 6;
  RestoreIdentityMode identity_mode = 7;
  string created_at = 8;
  string updated_at = 9;
  string completed_at = 10;
  repeated ValidationBlocker blockers = 11;
  repeated CleanupTask cleanup_tasks = 12;
  string error = 13;
  RestoreAuthSessionPolicy auth_session_policy = 14;
  RestoreTarget target = 15;
  RestoreStagingLocation staging = 16;
  RestorePreconditionEvidence preconditions = 17;
  RestoreProgress progress = 18;
}

message GetBackupPolicyRequest {}

message GetBackupPolicyResponse {
  BackupPolicy policy = 1;
}

message UpdateBackupPolicyRequest {
  BackupPolicy policy = 1;
}

message UpdateBackupPolicyResponse {
  BackupPolicy policy = 1;
}

message ListBackupRepositoriesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListBackupRepositoriesResponse {
  repeated BackupRepository repositories = 1;
  string next_page_token = 2;
}

message GetBackupRepositoryRequest {
  string repository_id = 1;
}

message GetBackupRepositoryResponse {
  BackupRepository repository = 1;
}

message CreateBackupRepositoryRequest {
  BackupRepository repository = 1;
}

message CreateBackupRepositoryResponse {
  BackupRepository repository = 1;
}

message UpdateBackupRepositoryRequest {
  BackupRepository repository = 1;
}

message UpdateBackupRepositoryResponse {
  BackupRepository repository = 1;
}

message ValidateBackupRepositoryRequest {
  string repository_id = 1;
}

message ValidateBackupRepositoryResponse {
  BackupRepository repository = 1;
  BackupRepositoryValidationSummary validation = 2;
}

message DeleteBackupRepositoryRequest {
  string repository_id = 1;
}

message DeleteBackupRepositoryResponse {
  string repository_id = 1;
  BackupDeletionState state = 2;
}

message StartBackupRequest {
  string reason = 1;
  BackupArchiveFormat archive_format = 2;
  // Optional client-provided key for idempotent start retries. Servers may return the existing
  // operation for the same key instead of creating a duplicate operation.
  string idempotency_key = 3;
  // Optional maximum time the operation may remain waiting for deployment convergence before failing.
  // Zero means the server default applies.
  int64 convergence_timeout_seconds = 4;
  // Required unless the daemon has an explicit default repository policy. The repository receives
  // the durable backup-set manifest, artifacts, and complete marker.
  string repository_id = 5;
  BackupCaptureProvider capture_provider = 6;
  ValidationOptions validation_options = 7;
  BackupQuiesceReadProfile quiesce_read_profile = 8;
}

message StartBackupResponse {
  BackupOperation operation = 1;
  BackupSetSummary backup_set = 2;
}

message GetBackupOperationRequest {
  string backup_set_id = 1;
  string backup_operation_id = 2;
}

message GetBackupOperationResponse {
  BackupOperation operation = 1;
}

message CancelBackupOperationRequest {
  string backup_set_id = 1;
  string reason = 2;
  string backup_operation_id = 3;
}

message CancelBackupOperationResponse {
  BackupOperation operation = 1;
}

message ListBackupOperationsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListBackupOperationsResponse {
  repeated BackupOperation operations = 1;
  string next_page_token = 2;
}

message ListBackupSetsRequest {
  string repository_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListBackupSetsResponse {
  repeated BackupSetSummary backup_sets = 1;
  string next_page_token = 2;
}

message GetBackupSetRequest {
  string repository_id = 1;
  string backup_set_id = 2;
}

message GetBackupSetResponse {
  BackupSetSummary backup_set = 1;
}

message ValidateBackupSetRequest {
  string repository_id = 1;
  string backup_set_id = 2;
  ValidationOptions validation_options = 3;
}

message ValidateBackupSetResponse {
  bool valid = 1;
  repeated string errors = 2;
  BackupSetSummary backup_set = 3;
  ValidationSummary validation = 4;
}

message DeleteBackupSetRequest {
  string repository_id = 1;
  string backup_set_id = 2;
  string reason = 3;
}

message DeleteBackupSetResponse {
  string repository_id = 1;
  string backup_set_id = 2;
  BackupDeletionState state = 3;
}

message PlanRepositoryRetentionRequest {
  string repository_id = 1;
  // Optional override. When omitted, the daemon's effective backup policy retention is used.
  RetentionPolicy retention_policy = 2;
  // Optional RFC3339/RFC3339Nano planning time for deterministic previews and tests.
  string now = 3;
}

message PlanRepositoryRetentionResponse {
  RepositoryRetentionPlan plan = 1;
}

message ApplyRepositoryRetentionRequest {
  string repository_id = 1;
  // Optional override. When omitted, the daemon's effective backup policy retention is used.
  RetentionPolicy retention_policy = 2;
  string reason = 3;
  // Optional RFC3339/RFC3339Nano planning time for deterministic previews and tests.
  string now = 4;
}

message ApplyRepositoryRetentionResponse {
  RepositoryRetentionPlan plan = 1;
}

message RepositoryRetentionPlan {
  string repository_id = 1;
  string planned_at = 2;
  RetentionPolicy retention_policy = 3;
  bool dry_run = 4;
  repeated RepositoryRetentionAction actions = 5;
  repeated string warnings = 6;
  int32 deleted_objects = 7;
}

message RepositoryRetentionAction {
  string backup_set_id = 1;
  string prefix = 2;
  // One of: keep, delete, blocked, delete_incomplete, warn.
  string action = 3;
  string reason = 4;
  string created_at = 5;
  string completed_at = 6;
  int32 object_count = 7;
  int32 deleted_objects = 8;
  bool retryable = 9;
  bool blocked = 10;
  string error = 11;
  string retention_cutoff = 12;
}

message GetBackupObservabilityRequest {
  // Optional repository to probe for retention/incomplete-backup conditions.
  // When empty, the daemon's default repository is used when available.
  string repository_id = 1;
  // Include a dry-run repository retention probe. This may perform object-store
  // list/read operations but never mutates repository contents.
  bool include_retention_probe = 2;
  // Threshold used by stale active operation alert conditions. Defaults to the
  // daemon backup timeout when unset, or 1 hour when no policy timeout exists.
  int64 stale_operation_after_seconds = 3;
  // Threshold used by backup freshness alert conditions. Defaults to twice the
  // backup schedule interval when unset, or 24 hours when no schedule exists.
  int64 backup_freshness_after_seconds = 4;
  // Threshold used by incomplete repository-prefix alerts. Defaults to the
  // effective retention policy's delete-incomplete-after duration when unset.
  int64 incomplete_backup_after_seconds = 5;
}

message GetBackupObservabilityResponse {
  BackupObservabilitySnapshot snapshot = 1;
}

message BackupObservabilitySnapshot {
  string observed_at = 1;
  string repository_id = 2;
  repeated BackupMetric metrics = 3;
  repeated BackupAlertCondition alerts = 4;
  // One of: healthy, warning, critical.
  string summary_state = 5;
}

message BackupMetric {
  // Stable metric name, e.g. mycel_backup_operation_count.
  string name = 1;
  string description = 2;
  // Unit values are conventional strings such as count, seconds, bytes, or ratio.
  string unit = 3;
  double value = 4;
  // Labels intentionally contain only non-secret identifiers and categories.
  map<string, string> labels = 5;
}

message BackupAlertCondition {
  string name = 1;
  // One of: info, warning, critical.
  string severity = 2;
  bool firing = 3;
  string reason = 4;
  // Prometheus-style expression using metric names from this snapshot.
  string expression = 5;
  // Labels intentionally contain only non-secret identifiers and categories.
  map<string, string> labels = 6;
  repeated string evidence = 7;
}

message BackupOperation {
  string backup_operation_id = 1;
  string backup_set_id = 2;
  string repository_id = 3;
  string deployment_id = 4;
  string deployment_name = 5;
  BackupDeploymentMode deployment_mode = 6;
  BackupOperationState state = 7;
  // Optional implementation-specific phase detail for operator diagnostics.
  string phase = 8;
  string reason = 9;
  string created_at = 10;
  string updated_at = 11;
  string completed_at = 12;
  int32 expected_node_count = 13;
  string manifest_uri = 14;
  repeated BackupNodeArtifact nodes = 15;
  // Raft convergence barriers are empty for standalone deployments.
  map<string, uint64> raft_barriers = 16;
  repeated BackupOperationBlocker blockers = 17;
  repeated CleanupTask cleanup_tasks = 18;
  ValidationSummary validation = 19;
  bool cancel_requested = 20;
  int64 retry_after_seconds = 21;
  string failed_phase = 22;
  string error = 23;
}

message BackupOperationBlocker {
  string node_name = 1;
  string node_id = 2;
  uint64 raft_node_id = 3;
  string raft_group = 4;
  string reason = 5;
  uint64 applied_index = 6;
  uint64 commit_index = 7;
  string detail = 8;
}

message BackupSetSummary {
  string backup_set_id = 1;
  string repository_id = 2;
  string deployment_id = 3;
  string deployment_name = 4;
  BackupDeploymentMode deployment_mode = 5;
  BackupOperationState state = 6;
  string created_at = 7;
  string completed_at = 8;
  int32 expected_node_count = 9;
  string manifest_uri = 10;
  repeated BackupNodeArtifact nodes = 11;
  CompatibilitySummary compatibility = 12;
  ValidationSummary validation = 13;
  BackupDeletionState deletion_state = 14;
  BackupRetentionClass retention_class = 15;
  BackupSetManifestSummary manifest = 16;
}

message BackupNodeArtifact {
  string pod_name = 1;
  string node_id = 2;
  int32 ordinal = 3;
  uint64 raft_node_id = 4;
  string archive_name = 5;
  string archive_uri = 6;
  string manifest_name = 7;
  string manifest_uri = 8;
  int64 size_bytes = 9;
  string checksum_sha256 = 10;
  map<string, uint64> applied_indexes = 11;
}

message PlanRestoreRequest {
  string repository_id = 1;
  string backup_set_id = 2;
  RestoreTargetMode target_mode = 3;
  RestoreIdentityMode identity_mode = 4;
  RestoreAuthSessionPolicy auth_session_policy = 5;
  ValidationOptions validation_options = 6;
  RestoreTarget target = 7;
  RestoreStagingLocation staging = 8;
}

message PlanRestoreResponse {
  RestorePlanSummary plan = 1;
}

message StartRestoreRequest {
  string restore_plan_id = 1;
  string repository_id = 2;
  string backup_set_id = 3;
  RestoreTargetMode target_mode = 4;
  RestoreIdentityMode identity_mode = 5;
  RestoreAuthSessionPolicy auth_session_policy = 6;
  string idempotency_key = 7;
  string destructive_confirmation = 8;
  RestoreTarget target = 9;
  RestoreStagingLocation staging = 10;
  RestorePreconditionEvidence preconditions = 11;
  string plan_freshness_token = 12;
}

message StartRestoreResponse {
  RestoreOperation operation = 1;
}

message GetRestoreOperationRequest {
  string restore_operation_id = 1;
}

message GetRestoreOperationResponse {
  RestoreOperation operation = 1;
}

message ListRestoreOperationsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListRestoreOperationsResponse {
  repeated RestoreOperation operations = 1;
  string next_page_token = 2;
}

message CancelRestoreOperationRequest {
  string restore_operation_id = 1;
  string reason = 2;
}

message CancelRestoreOperationResponse {
  RestoreOperation operation = 1;
}
