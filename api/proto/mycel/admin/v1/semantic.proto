syntax = "proto3";

package mycel.admin.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "mycel/client/v1/semantic.proto";

// AdminSemanticService manages semantic generation rule configuration through
// the operator-facing Admin API. Provider credentials/policies and maintenance
// are handled by separate Admin Inference and Admin Semantic Maintenance
// services.
service AdminSemanticService {
  rpc ListSemanticRules(ListSemanticRulesRequest) returns (ListSemanticRulesResponse);
  rpc GetSemanticRule(GetSemanticRuleRequest) returns (GetSemanticRuleResponse);
  rpc ValidateSemanticRule(ValidateSemanticRuleRequest) returns (ValidateSemanticRuleResponse);
  rpc CreateSemanticRule(CreateSemanticRuleRequest) returns (CreateSemanticRuleResponse);
  rpc UpdateSemanticRule(UpdateSemanticRuleRequest) returns (UpdateSemanticRuleResponse);
  rpc SetSemanticRuleEnabled(SetSemanticRuleEnabledRequest) returns (SetSemanticRuleEnabledResponse);
  rpc DeleteSemanticRule(DeleteSemanticRuleRequest) returns (DeleteSemanticRuleResponse);
}

message ListSemanticRulesRequest {
  string space_id = 1;
  string domain_id = 2;
  int32 page_size = 3;
  string page_token = 4;
  bool include_disabled = 5;
}

message ListSemanticRulesResponse {
  repeated mycel.client.v1.SemanticGenerationRuleSummary rules = 1;
  string next_page_token = 2;
}

message GetSemanticRuleRequest {
  string space_id = 1;
  string semantic_rule_id = 2;
}

message GetSemanticRuleResponse {
  SemanticGenerationRule rule = 1;
  mycel.client.v1.SemanticGenerationRuleSummary summary = 2;
}

message ValidateSemanticRuleRequest {
  SemanticGenerationRule rule = 1;
}

message ValidateSemanticRuleResponse {
  bool valid = 1;
  repeated SemanticRuleValidationDiagnostic diagnostics = 2;
  SemanticGenerationRule normalized_rule = 3;
}

message CreateSemanticRuleRequest {
  SemanticGenerationRule rule = 1;
}

message CreateSemanticRuleResponse {
  SemanticGenerationRule rule = 1;
  mycel.client.v1.SemanticGenerationRuleSummary summary = 2;
}

message UpdateSemanticRuleRequest {
  string space_id = 1;
  string semantic_rule_id = 2;
  SemanticGenerationRule rule = 3;
}

message UpdateSemanticRuleResponse {
  SemanticGenerationRule rule = 1;
  mycel.client.v1.SemanticGenerationRuleSummary summary = 2;
}

message SetSemanticRuleEnabledRequest {
  string space_id = 1;
  string semantic_rule_id = 2;
  bool enabled = 3;
}

message SetSemanticRuleEnabledResponse {
  SemanticGenerationRule rule = 1;
  mycel.client.v1.SemanticGenerationRuleSummary summary = 2;
}

message DeleteSemanticRuleRequest {
  string space_id = 1;
  string semantic_rule_id = 2;
  bool purge_vectors = 3;
}

message DeleteSemanticRuleResponse {
  string semantic_rule_id = 1;
  bool vectors_purged = 2;
  int32 work_items_deleted = 3;
  int32 policy_decisions_deleted = 4;
}

message SemanticGenerationRule {
  // Optional on create. If set on update, must match the target rule id.
  string semantic_rule_id = 1;
  string space_id = 2;
  string domain_id = 3;
  string key = 4;
  string display_name = 5;
  string description = 6;
  bool enabled = 7;
  SemanticTriggerPolicy trigger = 8;
  SemanticTargetSelector selector = 9;
  SemanticSourceAssemblyPolicy source = 10;
  repeated SemanticEmbeddingBinding embeddings = 11;
  SemanticMaintenancePolicy maintenance = 12;
  SemanticStoragePolicy storage = 13;
  string owner_principal_id = 14;
  string created_by_principal_id = 15;
  string created_at = 16;
  string updated_at = 17;
}

// SemanticTriggerEventType identifies a committed graph change that can make
// semantic output stale. The values in a trigger policy are treated as a set.
enum SemanticTriggerEventType {
  SEMANTIC_TRIGGER_EVENT_TYPE_UNSPECIFIED = 0;
  SEMANTIC_TRIGGER_EVENT_TYPE_CHANGED = 1;
  SEMANTIC_TRIGGER_EVENT_TYPE_NODE_CREATED = 2;
  SEMANTIC_TRIGGER_EVENT_TYPE_NODE_UPDATED = 3;
  SEMANTIC_TRIGGER_EVENT_TYPE_NODE_DELETED = 4;
  SEMANTIC_TRIGGER_EVENT_TYPE_EDGE_CHANGED = 5;
  SEMANTIC_TRIGGER_EVENT_TYPE_EDGE_CREATED = 6;
  SEMANTIC_TRIGGER_EVENT_TYPE_EDGE_UPDATED = 7;
  SEMANTIC_TRIGGER_EVENT_TYPE_EDGE_DELETED = 8;
}

message SemanticTriggerPolicy {
  // Typed trigger events. Explicit UNSPECIFIED and unknown numeric values are
  // invalid. An empty set defaults to SEMANTIC_TRIGGER_EVENT_TYPE_CHANGED.
  repeated SemanticTriggerEventType events = 1;
  repeated string labels = 2;

  // Go duration string such as "120s". Empty uses daemon default.
  string debounce = 3;

  reserved 4;
  reserved "event_types";
}

message SemanticTargetSelector {
  // node_type | gql | explicit_nodes
  string mode = 1;
  repeated string labels = 2;
  string gql = 3;
  string target_alias = 4;
  int32 max_results = 5;
  repeated string node_ids = 6;
}

message SemanticSourceAssemblyPolicy {
  // self | subtree | context_query
  string mode = 1;
  repeated string include_properties = 2;
  repeated string exclude_properties = 3;
  optional int32 max_depth = 4;
  int32 minimum_text_length = 5;
  string context_gql = 6;
}

message SemanticEmbeddingBinding {
  string key = 1;
  string purpose = 2;
  string intelligence_profile = 3;
  string intelligence_profile_id = 4;
  string vector_store = 5;
  string vector_store_id = 6;
  bool enabled = 7;
  google.protobuf.Struct metadata = 8;

  // Optional daemon-owned provider budget for this rule/binding. Clients
  // configure limits but never create scopes, reserve attempts, or release
  // capacity. The daemon pins the resolved route and creates the durable scope
  // before provider-backed work becomes eligible. Deterministic scope
  // preflight failures leave no rule. Once a create or update transition is
  // durably staged, an ambiguous storage or cluster failure can return an
  // error while leaving an ineligible pending rule; the daemon rolls that
  // journal forward before provider-backed work becomes eligible. An update
  // that changes the profile, route, or policy fails with FAILED_PRECONDITION
  // while the current scope has reserved or ambiguous attempts; otherwise it
  // completes and retains the old scope, then installs a new current scope.
  // Disable/delete prevents new attempts but retains prior scope evidence until
  // retention_until.
  SemanticProviderBudgetPolicy provider_budget = 9;
}

message SemanticProviderBudgetPolicy {
  // Operator correlation only: 1..128 ASCII characters from [A-Za-z0-9._:-].
  // It must not contain credentials, source text, or provider identifiers.
  string correlation_id = 1;

  // Every field in this policy is required; optional scalars are used to retain
  // wire presence. Every optional field must be explicitly present when the
  // policy is configured. Omitted fields, negative values, zero values (except
  // the two retry limits), unspecified batching, non-positive durations, and
  // inconsistent aggregate/per-request limits are invalid. The attempt limit
  // is derived with overflow checking as max_requests + max_retry_attempts.
  // max_retries_per_request must not exceed max_retry_attempts;
  // max_input_tokens_per_request must not exceed max_input_tokens; single-item
  // batching requires max_batch_items == 1; and request_timeout must not exceed
  // total_timeout. This strict shape prevents an omitted hard limit from
  // becoming an implicit unlimited value.
  optional int64 max_requests = 2;
  optional int64 max_retry_attempts = 3;
  optional int64 max_retries_per_request = 4;
  optional int64 max_concurrent_provider_calls = 5;
  optional SemanticProviderBatchingMode batching_mode = 6;
  optional int64 max_batch_items = 7;
  // Before reservation the daemon must derive a conservative upper bound from
  // the exact serialized input under the pinned route tokenizer. It must deny
  // work when no such bound can be proven.
  optional int64 max_input_tokens_per_request = 8;
  optional int64 max_input_tokens = 9;

  // Reserved before every provider attempt. The daemon applies the earliest of
  // this timeout and the caller/context deadline.
  google.protobuf.Duration request_timeout = 10;
  // Measured from durable scope creation and never extended by retries.
  google.protobuf.Duration total_timeout = 11;
  SemanticProviderCostLimit cost = 12;
}

message SemanticProviderCostLimit {
  // All fields are required and non-zero. Currency is an uppercase ISO 4217
  // code. The immutable definition version must identify pricing for the
  // pinned endpoint/model/capability route.
  string currency = 1;
  string price_definition_version = 2;
  optional int64 input_micros_per_million_tokens = 3;
  optional int64 max_estimated_cost_micros = 4;
  // Per-attempt reserved cost is ceil(reserved_input_tokens *
  // input_micros_per_million_tokens / 1,000,000). Implementations must use
  // overflow-checked integer arithmetic and deny the attempt on overflow.
  // Final cost uses the same formula with charged tokens. If charged tokens,
  // provider duration, or cost exceeds its reservation, the daemon charges the
  // checked actual value, records immutable overage evidence, exhausts the
  // scope for accounting failure, and admits no later provider attempt. If the
  // final per-attempt cost is not representable as int64, the event and
  // aggregate cost saturate at int64 max, charged_cost_saturated and
  // accounting_overflow are set, and the scope is exhausted with ACCOUNTING.
}

enum SemanticProviderBatchingMode {
  SEMANTIC_PROVIDER_BATCHING_MODE_UNSPECIFIED = 0;
  SEMANTIC_PROVIDER_BATCHING_MODE_SINGLE = 1;
  SEMANTIC_PROVIDER_BATCHING_MODE_BATCH = 2;
}

message SemanticMaintenancePolicy {
  // Go duration string such as "120s". Empty uses daemon default.
  string dirty_cooldown = 1;
  int32 max_batch_size = 2;
  int32 worker_concurrency = 3;
}

message SemanticStoragePolicy {
  bool searchable = 1;

  // exact for the first physical search-index implementation; future values may
  // include ANN variants.
  string physical_index = 2;
}

message SemanticRuleValidationDiagnostic {
  // error | warning | info
  string severity = 1;
  string path = 2;
  string message = 3;
}
