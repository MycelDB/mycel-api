syntax = "proto3";

package mycel.client.v1;

import "google/protobuf/struct.proto";
import "mycel/client/v1/graph.proto";

// SemanticService exposes client-facing semantic generation rule discovery and
// semantic search. Rule authoring, provider credentials, policies, maintenance,
// and backfill controls belong to the Admin API.
service SemanticService {
  // ListSemanticRules lists searchable semantic generation rules available to
  // the authenticated caller for a space/domain.
  rpc ListSemanticRules(ListSemanticRulesRequest) returns (ListSemanticRulesResponse);

  // SemanticSearch searches committed semantic rule binding state for a
  // space/domain.
  rpc SemanticSearch(SemanticSearchRequest) returns (SemanticSearchResponse);
}

message ListSemanticRulesRequest {
  string space_id = 1;
  string domain_id = 2;
  int32 page_size = 3;
  string page_token = 4;
  bool include_disabled = 5;
}

message ListSemanticRulesResponse {
  repeated SemanticGenerationRuleSummary rules = 1;
  string next_page_token = 2;
}

message SemanticSearchRequest {
  string space_id = 1;
  string domain_id = 2;

  // Optional. If omitted, the daemon searches all enabled searchable semantic
  // rule bindings for the domain that the caller can read.
  optional string semantic_rule_id = 3;

  // Optional. Requires semantic_rule_id when set.
  optional string embedding_binding_key = 4;

  string query = 5;
  int32 limit = 6;

  // Optional minimum score threshold. Score meaning is model dependent but
  // higher scores should represent more relevant results.
  optional double min_score = 7;

  // Opaque direct-semantic continuation. The daemon binds this token to the
  // authenticated visibility scope, graph/index view, ranking version,
  // continuation position, canonical normalized filter, and every
  // result-affecting request field except page_token, including the query,
  // limit, score threshold, rule, and binding. A malformed or integrity-invalid
  // token fails with INVALID_ARGUMENT. A valid token used with a different
  // request/scope or a stale graph, rule, binding, route, generation, ranking,
  // or candidate view fails with FAILED_PRECONDITION.
  optional string page_token = 8;

  // Optional hard-eligibility filter for direct semantic candidates. The
  // daemon authorizes graph visibility before evaluating properties and
  // applies eligibility before score thresholding, ranking, and page
  // truncation. All labels, node IDs, and property predicates are combined
  // with logical AND.
  SemanticEligibilityFilter filter = 9;
}

message SemanticSearchResponse {
  repeated SemanticSearchResult results = 1;

  // Non-fatal search warnings such as stale rule state, degraded physical
  // search indexes, unavailable vector spaces, or skipped providers. Warnings
  // must not include secrets.
  repeated string warnings = 2;

  // Opaque continuation for the same direct-semantic request and authorized
  // read/index view. See SemanticSearchRequest.page_token for binding and
  // error semantics.
  string next_page_token = 3;

  // Empty when no filter was requested; otherwise
  // "semantic_index_pushdown" or "authorized_candidate_post_filter".
  string filter_execution_mode = 4;
  // Number of caller-visible, authorized semantic candidates examined. This
  // never includes candidates hidden by graph or semantic authorization.
  // Implementations that cannot produce this count without disclosure return
  // zero rather than exposing a pre-authorization count.
  int32 examined_semantic_candidates = 5;
  // Number of caller-visible, authorized candidates satisfying filter before
  // minimum-score evaluation, ranking, and page truncation. Implementations
  // that cannot produce this safely return zero.
  int32 eligible_semantic_candidates = 6;
}

message SemanticEligibilityFilter {
  // Every listed label is required.
  repeated string node_labels = 1;
  // When non-empty, only these exact node IDs are eligible.
  repeated string node_ids = 2;
  // Every property predicate is required. Property keys are top-level payload
  // keys. Missing is distinct from a present null value.
  repeated SemanticPropertyPredicate properties = 3;
}

message SemanticPropertyPredicate {
  string key = 1;
  // UNSPECIFIED and unknown operators are invalid and fail with
  // INVALID_ARGUMENT.
  SemanticPropertyOperator operator = 2;
  // EQUAL and NOT_EQUAL require value. Equality is exact, type-sensitive
  // protobuf Value equality: scalar kinds and values must match, list order and
  // elements must match, and struct key/value mappings must match. A missing
  // key satisfies neither EQUAL nor NOT_EQUAL. EXISTS and MISSING reject a
  // supplied value; EXISTS is true for a present key including null, while
  // MISSING is true only when the key is absent.
  google.protobuf.Value value = 3;
}

enum SemanticPropertyOperator {
  SEMANTIC_PROPERTY_OPERATOR_UNSPECIFIED = 0;
  SEMANTIC_PROPERTY_OPERATOR_EQUAL = 1;
  SEMANTIC_PROPERTY_OPERATOR_NOT_EQUAL = 2;
  SEMANTIC_PROPERTY_OPERATOR_EXISTS = 3;
  SEMANTIC_PROPERTY_OPERATOR_MISSING = 4;
}

message SemanticSearchResult {
  string semantic_rule_id = 1;
  string embedding_binding_key = 2;
  string record_id = 3;
  string node_id = 4;
  double score = 5;

  // Included for client convenience. Result visibility still requires graph.read
  // and semantic.search authorization.
  Node node = 6;

  repeated string matched_chunk_ids = 7;
  string snippet = 8;

  // Safe, authorization-scoped generation evidence. It excludes credentials,
  // raw vectors, projected source text, and source-content digests.
  SemanticResultProvenance provenance = 9;
}

message SemanticResultProvenance {
  uint64 source_graph_revision = 1;
  uint64 semantic_generation = 2;
  string semantic_configuration_hash = 3;
  string opaque_source_version = 4;
  int32 dimensions = 5;
  string vector_space_key = 6;
  string configured_intelligence_profile_id = 7;
  string configured_model_endpoint_id = 8;
  string configured_model_id = 9;
  string configured_capability_id = 10;
  bool actual_route_known = 11;
  string actual_model_endpoint_id = 12;
  string actual_model_id = 13;
  string actual_capability_id = 14;
  string rebuild_epoch = 15;
  string generated_at = 16;
}

message SemanticGenerationRuleSummary {
  string semantic_rule_id = 1;
  string key = 2;
  string display_name = 3;
  string description = 4;
  string space_id = 5;
  string domain_id = 6;
  bool enabled = 7;
  SemanticRuleState state = 8;
  repeated SemanticEmbeddingBindingSummary bindings = 9;
  SemanticRuleStatus status = 10;
}

enum SemanticRuleState {
  SEMANTIC_RULE_STATE_UNSPECIFIED = 0;
  SEMANTIC_RULE_STATE_ACTIVE = 1;
  SEMANTIC_RULE_STATE_BUILDING = 2;
  SEMANTIC_RULE_STATE_STALE = 3;
  SEMANTIC_RULE_STATE_DISABLED = 4;
  SEMANTIC_RULE_STATE_ERROR = 5;
}

message SemanticEmbeddingBindingSummary {
  string key = 1;
  string purpose = 2;
  string intelligence_profile_id = 3;
  string intelligence_profile_key = 4;
  string vector_store_id = 5;
  string vector_store_key = 6;
  bool enabled = 7;
  SearchIndexStatus search_index = 8;
}

message SearchIndexStatus {
  SearchIndexState state = 1;
  int64 live_record_count = 2;
  string last_rebuild_at = 3;
  string last_error = 4;
}

enum SearchIndexState {
  SEARCH_INDEX_STATE_UNSPECIFIED = 0;
  SEARCH_INDEX_STATE_READY = 1;
  SEARCH_INDEX_STATE_BUILDING = 2;
  SEARCH_INDEX_STATE_DEGRADED = 3;
  SEARCH_INDEX_STATE_MISSING = 4;
  SEARCH_INDEX_STATE_ERROR = 5;
}

message SemanticRuleStatus {
  int32 queue_depth_pending = 1;
  int32 queue_depth_running = 2;
  int32 queue_depth_failed_retryable = 3;
  int32 queue_depth_failed_permanent = 4;
  string last_refresh_at = 5;
  string last_backfill_at = 6;
  string last_error = 7;
}
