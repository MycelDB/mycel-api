syntax = "proto3";

package mycel.client.v1;

import "google/protobuf/timestamp.proto";
import "mycel/client/v1/graph.proto";

// ImportExportService provides client/application data portability for domains
// and space-scoped export artifacts. It is distinct from admin backup/restore. Format-specific importers such as
// Logseq importers convert source data into Mycel-native import streams before
// calling this service.
service ImportExportService {
  // ExportDomain streams graph/domain data from a transaction read context.
  rpc ExportDomain(ExportDomainRequest) returns (stream ExportDomainResponse);

  // ImportDomain streams Mycel-native records into a read-write transaction.
  rpc ImportDomain(stream ImportDomainRequest) returns (ImportDomainResponse);

  // CreateSpaceExport starts a ZIP export job for one authorized space. The job
  // can include one or more domains and produces a downloadable artifact stored
  // by the daemon for a bounded retention window.
  rpc CreateSpaceExport(CreateSpaceExportRequest) returns (CreateSpaceExportResponse);

  // GetSpaceExport returns status/progress and artifact metadata for a job
  // created by the authenticated principal.
  rpc GetSpaceExport(GetSpaceExportRequest) returns (GetSpaceExportResponse);

  // ListSpaceExports lists recent export jobs created by the authenticated
  // principal, optionally filtered by space.
  rpc ListSpaceExports(ListSpaceExportsRequest) returns (ListSpaceExportsResponse);

  // DownloadSpaceExport streams a completed artifact created by the
  // authenticated principal.
  rpc DownloadSpaceExport(DownloadSpaceExportRequest) returns (stream DownloadSpaceExportResponse);

  // DeleteSpaceExport removes an artifact/job created by the authenticated
  // principal before automatic expiry.
  rpc DeleteSpaceExport(DeleteSpaceExportRequest) returns (DeleteSpaceExportResponse);
}

message ExportDomainRequest {
  // Readable transaction id. The transaction determines space/domain and read
  // consistency. Read-only exports are current reads in V1, not pinned
  // historical snapshots.
  string transaction_id = 1;
  DomainExportFormat format = 2;
  DomainExportOptions options = 3;
}

message ExportDomainResponse {
  oneof part {
    DomainExportManifest manifest = 1;

    // Structured records are used by DOMAIN_EXPORT_FORMAT_MYCEL_STREAM.
    ImportExportRecord record = 2;

    // Raw chunks are used by JSON/NDJSON formats or other encoded payloads.
    bytes chunk = 3;
  }
}

message ImportDomainRequest {
  oneof part {
    ImportDomainMetadata metadata = 1;

    // Structured records are used by DOMAIN_IMPORT_FORMAT_MYCEL_STREAM.
    ImportExportRecord record = 2;

    // Raw chunks are used by JSON/NDJSON formats or other encoded payloads.
    bytes chunk = 3;
  }
}

message ImportDomainResponse {
  ImportSummary summary = 1;
}

message CreateSpaceExportRequest {
  SpaceExportOptions options = 1;
}

message CreateSpaceExportResponse {
  SpaceExportJob job = 1;
}

message GetSpaceExportRequest {
  string export_id = 1;
}

message GetSpaceExportResponse {
  SpaceExportJob job = 1;
}

message ListSpaceExportsRequest {
  string space_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListSpaceExportsResponse {
  repeated SpaceExportJob jobs = 1;
  string next_page_token = 2;
}

message DownloadSpaceExportRequest {
  string export_id = 1;
}

message DownloadSpaceExportResponse {
  bytes chunk = 1;
}

message DeleteSpaceExportRequest {
  string export_id = 1;
}

message DeleteSpaceExportResponse {
  string export_id = 1;
  bool deleted = 2;
}

message SpaceExportOptions {
  // Required target space. The authenticated principal must be allowed to read
  // the space and every requested domain.
  string space_id = 1;

  // Optional domain selection. If empty, the export includes all visible
  // non-system domains in the space, plus system domains when
  // include_system_domains is true.
  repeated string domain_ids = 2;

  bool include_blobs = 3;
  bool include_system_domains = 4;
}

message SpaceExportJob {
  string export_id = 1;
  SpaceExportStatus status = 2;
  string format_version = 3;
  string filename = 4;
  int64 size_bytes = 5;
  int32 progress_percent = 6;
  SpaceExportCounts counts = 7;
  string error_message = 8;
  google.protobuf.Timestamp create_time = 9;
  google.protobuf.Timestamp update_time = 10;
  google.protobuf.Timestamp complete_time = 11;
  google.protobuf.Timestamp expire_time = 12;
  SpaceExportOptions options = 13;
  string requested_by_principal_id = 14;
}

message SpaceExportCounts {
  int32 spaces = 1;
  int32 domains = 2;
  int32 nodes = 3;
  int32 edges = 4;
  int32 blobs = 5;
  int32 files = 6;
}

message ImportDomainMetadata {
  // Read-write transaction id. The transaction determines target space/domain.
  string transaction_id = 1;
  DomainImportFormat format = 2;
  DomainImportMode mode = 3;
  DomainImportOptions options = 4;

  // Optional source labels for diagnostics/audit, for example "logseq".
  string source_system = 5;
  string source_label = 6;
}

message DomainExportOptions {
  bool include_blobs = 2;

  // Semantic generation rule configuration/content is not exported by the Client
  // API in v1. This field is reserved as an explicit, currently unsupported
  // request flag so clients can receive a clear error if they ask for it.
  bool include_semantic_rules = 3;
}

message DomainImportOptions {
  bool include_blobs = 2;

  // Preserve client-supplied ids where valid. If false, the daemon may allocate
  // new ids and return counts only.
  bool preserve_ids = 3;

  // Validate the stream and report what would be imported without mutating the
  // transaction.
  bool dry_run = 4;
}

message DomainExportManifest {
  DomainExportFormat format = 1;
  string space_id = 2;
  string domain_id = 3;
  int64 base_revision = 4;
  google.protobuf.Timestamp export_time = 5;
  DomainExportOptions options = 6;
}

message ImportSummary {
  int64 nodes_imported = 2;
  int64 edges_imported = 3;
  int64 blobs_imported = 4;
  int64 nodes_updated = 5;
  int64 edges_updated = 6;
  bool dry_run = 7;
  repeated string warnings = 8;
}

// ImportExportRecord is the structured Mycel-native import/export record. It is
// generic enough for application importers such as the Logseq importer to map
// external data to Mycel graph, template, and blob records without making the
// daemon understand source-specific formats.
message ImportExportRecord {
  // Optional stable external identity used by importers for upsert/re-import
  // workflows. For example, the Logseq importer can map a page/block id to a
  // stable Mycel node.
  ImportIdentity identity = 1;

  oneof record {
    Node node = 3;
    Edge edge = 4;
    BlobImportMetadata blob_metadata = 5;
    BlobImportChunk blob_chunk = 6;
  }
}

message ImportIdentity {
  string source_system = 1;
  string source_id = 2;
}

message BlobImportMetadata {
  // Import-local id used to associate subsequent chunks and blob-backed nodes.
  string import_blob_id = 1;
  string declared_mime_type = 2;
  string original_filename = 3;
  string digest = 4;
  int64 size_bytes = 5;
}

message BlobImportChunk {
  string import_blob_id = 1;
  bytes chunk = 2;
}

enum SpaceExportStatus {
  SPACE_EXPORT_STATUS_UNSPECIFIED = 0;
  SPACE_EXPORT_STATUS_QUEUED = 1;
  SPACE_EXPORT_STATUS_RUNNING = 2;
  SPACE_EXPORT_STATUS_SUCCEEDED = 3;
  SPACE_EXPORT_STATUS_FAILED = 4;
  SPACE_EXPORT_STATUS_DELETED = 5;
  SPACE_EXPORT_STATUS_EXPIRED = 6;
}

enum DomainExportFormat {
  DOMAIN_EXPORT_FORMAT_UNSPECIFIED = 0;
  DOMAIN_EXPORT_FORMAT_MYCEL_STREAM = 1;
  DOMAIN_EXPORT_FORMAT_MYCEL_JSON = 2;
  DOMAIN_EXPORT_FORMAT_MYCEL_NDJSON = 3;
}

enum DomainImportFormat {
  DOMAIN_IMPORT_FORMAT_UNSPECIFIED = 0;
  DOMAIN_IMPORT_FORMAT_MYCEL_STREAM = 1;
  DOMAIN_IMPORT_FORMAT_MYCEL_JSON = 2;
  DOMAIN_IMPORT_FORMAT_MYCEL_NDJSON = 3;
}

enum DomainImportMode {
  DOMAIN_IMPORT_MODE_UNSPECIFIED = 0;

  // Create new records and fail on duplicate ids/import identities.
  DOMAIN_IMPORT_MODE_APPEND = 1;

  // Create or update records by supplied ids/import identities.
  DOMAIN_IMPORT_MODE_UPSERT = 2;

  // Clear the domain then import the stream. This is destructive and requires
  // delete capabilities in addition to write capabilities.
  DOMAIN_IMPORT_MODE_REPLACE_DOMAIN = 3;
}
