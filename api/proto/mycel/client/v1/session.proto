syntax = "proto3";

package mycel.client.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// SessionService manages daemon-owned graph sessions. A session is a
// space/domain-scoped working context used for caching, resource pinning, and
// repeated transactions.
service SessionService {
  // OpenSession opens a daemon-owned working context for one space/domain.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);

  // GetSession returns the current state of an open or recently closed session.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);

  // HeartbeatSession extends or refreshes the session lifetime. Transactions do
  // not have independent heartbeats and expire no later than their parent
  // session.
  rpc HeartbeatSession(HeartbeatSessionRequest) returns (HeartbeatSessionResponse);

  // CloseSession closes a session, releases resources, closes open read
  // transactions, and rolls back open write transactions.
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
}

// TransactionService manages atomic graph/query transactions inside a session.
// Graph and query operations target transaction_id, not session_id.
service TransactionService {
  // BeginTransaction starts a read-only or read-write transaction inside an
  // open session.
  rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse);

  // GetTransaction returns transaction state and revision metadata.
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);

  // CommitTransaction commits a read-write transaction and advances the domain
  // revision. An idempotency key may bind the commit to a durable result so an
  // ambiguous commit response can be retried safely.
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);

  // RollbackTransaction discards pending mutations in a read-write transaction.
  rpc RollbackTransaction(RollbackTransactionRequest) returns (RollbackTransactionResponse);

  // CloseTransaction releases transaction resources. Closing a read-write
  // transaction with uncommitted mutations rolls it back.
  rpc CloseTransaction(CloseTransactionRequest) returns (CloseTransactionResponse);
}

message OpenSessionRequest {
  string space_id = 1;
  string domain_id = 2;

  // Optional client-requested idle timeout. The daemon may cap or ignore this
  // value according to policy.
  google.protobuf.Duration requested_idle_timeout = 3;
}

message OpenSessionResponse {
  GraphSession session = 1;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  GraphSession session = 1;
}

message HeartbeatSessionRequest {
  string session_id = 1;

  // Optional client-requested extension. The daemon may cap or ignore this
  // value according to policy.
  google.protobuf.Duration requested_extension = 2;
}

message HeartbeatSessionResponse {
  GraphSession session = 1;
}

message CloseSessionRequest {
  string session_id = 1;
}

message CloseSessionResponse {
  GraphSession session = 1;
}

message BeginTransactionRequest {
  string session_id = 1;
  TransactionMode mode = 2;

  // Optional client-generated operation UUID used to correlate committed graph
  // change events with the logical client write that produced them. If omitted,
  // the daemon generates one and returns it on GraphTransaction and
  // TransactionCommit.
  string operation_id = 3;
}

message BeginTransactionResponse {
  GraphTransaction transaction = 1;
}

message GetTransactionRequest {
  string transaction_id = 1;
}

message GetTransactionResponse {
  GraphTransaction transaction = 1;
}

message CommitTransactionRequest {
  string transaction_id = 1;

  // Optional opaque key for durable commit idempotency. Keys are scoped by the
  // authenticated principal, space_id, and domain_id. A key is limited to 128
  // UTF-8 bytes, must not have leading or trailing whitespace, and must not
  // contain secrets.
  //
  // The first successful commit binds the key to the canonical graph mutation
  // and original TransactionCommit. A retry with the same key and mutation
  // returns that commit without advancing the graph revision or emitting
  // duplicate change events. Reusing the key for a different mutation fails
  // with ALREADY_EXISTS while the binding is retained.
  //
  // space_id and domain_id are required when this field is set. Callers should
  // persist all four fields until the commit outcome is reconciled so the
  // request remains retryable after daemon restart or leader change.
  string idempotency_key = 2;

  // Scope used to recover a durable idempotent result when daemon-local
  // transaction lifecycle state is no longer available.
  string space_id = 3;
  string domain_id = 4;
}

message CommitTransactionResponse {
  TransactionCommit commit = 1;

  // True when commit is the result of an earlier successful request with the
  // same idempotency binding. False for the first successful commit and for
  // commits that do not use idempotency_key.
  bool idempotent_replay = 2;
}

message RollbackTransactionRequest {
  string transaction_id = 1;
}

message RollbackTransactionResponse {
  GraphTransaction transaction = 1;
}

message CloseTransactionRequest {
  string transaction_id = 1;
}

message CloseTransactionResponse {
  GraphTransaction transaction = 1;
}

// GraphSession is a daemon-local working context for one space/domain.
message GraphSession {
  string session_id = 1;
  string space_id = 2;
  string domain_id = 3;
  SessionState state = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp last_seen_time = 6;
  google.protobuf.Timestamp expire_time = 7;
}

// GraphTransaction is an atomic read or write unit inside a GraphSession.
// In the current daemon, read-only transactions are linearizable current-read
// contexts, not historical repeatable snapshots: base_revision records the
// revision observed at begin time, while later reads may observe newer commits.
message GraphTransaction {
  string transaction_id = 1;
  string session_id = 2;
  string space_id = 3;
  string domain_id = 4;
  TransactionMode mode = 5;
  TransactionState state = 6;

  // Domain revision observed when the transaction began. The daemon is
  // authoritative for this value. For read-only transactions this is a
  // freshness floor and diagnostic/cache-validation value, not a pinned
  // historical snapshot revision.
  int64 base_revision = 7;

  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp last_seen_time = 9;
  google.protobuf.Timestamp expire_time = 10;

  // Client write correlation UUID associated with this transaction.
  string operation_id = 11;
}

// TransactionCommit describes a committed read-write transaction. It is the
// natural unit for audit records and future replication/oplog streams.
message TransactionCommit {
  string commit_id = 1;
  string transaction_id = 2;
  string session_id = 3;
  string space_id = 4;
  string domain_id = 5;
  int64 base_revision = 6;
  int64 committed_revision = 7;
  int32 operation_count = 8;
  google.protobuf.Timestamp commit_time = 9;

  // Client write correlation UUID associated with this commit.
  string operation_id = 10;

  // Durable idempotency key associated with this commit, if one was supplied.
  string idempotency_key = 11;

  // Time until which the daemon guarantees retention of this idempotency
  // binding. Absent when idempotency_key is empty. After this time, reusing the
  // key may create a new commit.
  google.protobuf.Timestamp idempotency_expire_time = 12;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_ACTIVE = 1;
  SESSION_STATE_CLOSED = 2;
  SESSION_STATE_EXPIRED = 3;
}

enum TransactionMode {
  TRANSACTION_MODE_UNSPECIFIED = 0;
  TRANSACTION_MODE_READ_ONLY = 1;
  TRANSACTION_MODE_READ_WRITE = 2;
}

enum TransactionState {
  TRANSACTION_STATE_UNSPECIFIED = 0;
  TRANSACTION_STATE_ACTIVE = 1;
  TRANSACTION_STATE_COMMITTED = 2;
  TRANSACTION_STATE_ROLLED_BACK = 3;
  TRANSACTION_STATE_CLOSED = 4;
  TRANSACTION_STATE_EXPIRED = 5;
  TRANSACTION_STATE_ABORTED = 6;
}
