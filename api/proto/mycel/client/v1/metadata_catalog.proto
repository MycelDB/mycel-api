syntax = "proto3";

package mycel.client.v1;

import "mycel/client/v1/graph.proto";

// MetadataCatalogService provides transaction-scoped metadata catalog discovery.
// It is intentionally limited to summaries such as known tags and property
// names. Metadata filtering/search belongs in QueryService so graph traversal
// and metadata predicates can be composed in one query.
service MetadataCatalogService {
  // ListTags lists known canonical tags visible in the transaction read context.
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);

  // ListPropertyNames lists known canonical custom property names visible in the
  // transaction read context.
  rpc ListPropertyNames(ListPropertyNamesRequest) returns (ListPropertyNamesResponse);
}

message ListTagsRequest {
  string transaction_id = 1;

  // Maximum number of tags to return. The daemon may cap this value.
  int32 page_size = 2;

  // Opaque continuation token returned by a previous list call.
  string page_token = 3;
  ReadOptions read_options = 4;
}

message ListTagsResponse {
  repeated TagSummary tags = 1;
  string next_page_token = 2;
  ReadMetadata read_metadata = 3;
}

message ListPropertyNamesRequest {
  string transaction_id = 1;

  // Maximum number of property names to return. The daemon may cap this value.
  int32 page_size = 2;

  // Opaque continuation token returned by a previous list call.
  string page_token = 3;
  ReadOptions read_options = 4;
}

message ListPropertyNamesResponse {
  repeated PropertySummary properties = 1;
  string next_page_token = 2;
  ReadMetadata read_metadata = 3;
}

message TagSummary {
  string name = 1;
  int64 node_count = 2;
}

message PropertySummary {
  string name = 1;
  int64 node_count = 2;
}
