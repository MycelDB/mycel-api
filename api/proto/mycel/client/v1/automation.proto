syntax = "proto3";

package mycel.client.v1;

import "mycel/common/v1/inference.proto";

// AutomationService manages domain-scoped graph automation definitions and run history.
service AutomationService {
  rpc ValidateAutomation(ValidateAutomationRequest) returns (ValidateAutomationResponse);
  rpc CreateAutomation(CreateAutomationRequest) returns (CreateAutomationResponse);
  rpc UpdateAutomation(UpdateAutomationRequest) returns (UpdateAutomationResponse);
  rpc DeleteAutomation(DeleteAutomationRequest) returns (DeleteAutomationResponse);
  rpc GetAutomation(GetAutomationRequest) returns (GetAutomationResponse);
  rpc ListAutomations(ListAutomationsRequest) returns (ListAutomationsResponse);
  rpc EnableAutomation(EnableAutomationRequest) returns (EnableAutomationResponse);
  rpc DisableAutomation(DisableAutomationRequest) returns (DisableAutomationResponse);
  rpc ListAutomationInvocations(ListAutomationInvocationsRequest) returns (ListAutomationInvocationsResponse);
  rpc GetAutomationRun(GetAutomationRunRequest) returns (GetAutomationRunResponse);
  rpc RetryAutomationInvocation(RetryAutomationInvocationRequest) returns (RetryAutomationInvocationResponse);
  rpc CancelAutomationInvocation(CancelAutomationInvocationRequest) returns (CancelAutomationInvocationResponse);
  rpc ValidateGraphProcedure(ValidateGraphProcedureRequest) returns (ValidateGraphProcedureResponse);
  rpc CreateGraphProcedure(CreateGraphProcedureRequest) returns (CreateGraphProcedureResponse);
  rpc UpdateGraphProcedure(UpdateGraphProcedureRequest) returns (UpdateGraphProcedureResponse);
  rpc DeleteGraphProcedure(DeleteGraphProcedureRequest) returns (DeleteGraphProcedureResponse);
  rpc GetGraphProcedure(GetGraphProcedureRequest) returns (GetGraphProcedureResponse);
  rpc ListGraphProcedures(ListGraphProceduresRequest) returns (ListGraphProceduresResponse);
  rpc ValidateGraphAutomationBinding(ValidateGraphAutomationBindingRequest) returns (ValidateGraphAutomationBindingResponse);
  rpc CreateGraphAutomationBinding(CreateGraphAutomationBindingRequest) returns (CreateGraphAutomationBindingResponse);
  rpc UpdateGraphAutomationBinding(UpdateGraphAutomationBindingRequest) returns (UpdateGraphAutomationBindingResponse);
  rpc DeleteGraphAutomationBinding(DeleteGraphAutomationBindingRequest) returns (DeleteGraphAutomationBindingResponse);
  rpc GetGraphAutomationBinding(GetGraphAutomationBindingRequest) returns (GetGraphAutomationBindingResponse);
  rpc ListGraphAutomationBindings(ListGraphAutomationBindingsRequest) returns (ListGraphAutomationBindingsResponse);
  rpc EnableGraphAutomationBinding(EnableGraphAutomationBindingRequest) returns (EnableGraphAutomationBindingResponse);
  rpc DisableGraphAutomationBinding(DisableGraphAutomationBindingRequest) returns (DisableGraphAutomationBindingResponse);
}

message ValidateAutomationRequest {
  string domain_id = 1;
  string definition_json = 2;
}

message ValidateAutomationResponse {
  bool valid = 1;
  string error = 2;
  string normalized_definition_json = 3;
  repeated AutomationInferenceRef inference_refs = 4;
}

message CreateAutomationRequest {
  string domain_id = 1;
  string definition_json = 2;
}

message UpdateAutomationRequest {
  string domain_id = 1;
  string automation_id = 2;
  string definition_json = 3;
}

message DeleteAutomationRequest {
  string domain_id = 1;
  string automation_id = 2;
}

message DeleteAutomationResponse {}

message GetAutomationRequest {
  string domain_id = 1;
  string automation_id = 2;
}

message ListAutomationsRequest {
  string domain_id = 1;
  string status = 2;
}

message ListAutomationsResponse {
  repeated AutomationDefinitionSummary automations = 1;
}

message EnableAutomationRequest {
  string domain_id = 1;
  string automation_id = 2;
}

message DisableAutomationRequest {
  string domain_id = 1;
  string automation_id = 2;
}

message CreateAutomationResponse {
  string definition_json = 1;
}

message UpdateAutomationResponse {
  string definition_json = 1;
}

message GetAutomationResponse {
  string definition_json = 1;
}

message EnableAutomationResponse {
  string definition_json = 1;
}

message DisableAutomationResponse {
  string definition_json = 1;
}

message AutomationDefinitionSummary {
  string id = 1;
  string name = 2;
  int32 version = 3;
  string status = 4;
  repeated string events = 5;
  repeated string labels = 6;
  string updated_at = 7;
  repeated string intelligence_profiles = 8;
  string binding_id = 9;
  int32 binding_version = 10;
  string procedure_id = 11;
  int32 procedure_version = 12;
  string trigger_type = 13;
  string owner_principal_id = 14;
  string on_behalf_of_principal_id = 15;
  string actor_principal_id = 16;
  string scope_space_id = 17;
  string scope_domain_id = 18;
}

message GraphProcedureSummary {
  string id = 1;
  string name = 2;
  int32 version = 3;
  string status = 4;
  string updated_at = 5;
  string operation = 6;
  string inference_profile = 7;
  string inference_profile_id = 8;
}

message GraphAutomationBindingSummary {
  string id = 1;
  string name = 2;
  int32 version = 3;
  string status = 4;
  string procedure_id = 5;
  int32 procedure_version = 6;
  string trigger_type = 7;
  repeated string events = 8;
  repeated string labels = 9;
  string actor_principal_id = 10;
  string owner_principal_id = 11;
  string on_behalf_of_principal_id = 12;
  string inference_profile = 13;
  string inference_profile_id = 14;
  string scope_space_id = 15;
  string scope_domain_id = 16;
  string updated_at = 17;
}

message ListAutomationInvocationsRequest {
  string domain_id = 1;
  string automation_id = 2;
  string status = 3;
  int32 limit = 4;
}

message ListAutomationInvocationsResponse {
  repeated AutomationInvocationSummary invocations = 1;
}

message AutomationInvocationSummary {
  string id = 1;
  string automation_id = 2;
  int32 automation_version = 3;
  string event_id = 4;
  string changed_element_id = 5;
  string event_type = 6;
  string status = 7;
  string skip_reason = 8;
  string created_at = 9;
  string updated_at = 10;
  string binding_id = 11;
  int32 binding_version = 12;
  string procedure_id = 13;
  int32 procedure_version = 14;
  string actor_principal_id = 15;
  string owner_principal_id = 16;
  string on_behalf_of_principal_id = 17;
  string event_origin_principal_id = 18;
}

message GetAutomationRunRequest {
  string domain_id = 1;
  string run_id = 2;
}

message GetAutomationRunResponse {
  string run_json = 1;
  repeated string inference_usage_event_ids = 2;
}

message RetryAutomationInvocationRequest {
  string domain_id = 1;
  string invocation_id = 2;
}

message RetryAutomationInvocationResponse {
  AutomationInvocationSummary invocation = 1;
}

message CancelAutomationInvocationRequest {
  string domain_id = 1;
  string invocation_id = 2;
}

message CancelAutomationInvocationResponse {
  AutomationInvocationSummary invocation = 1;
}

message AutomationInferenceRef {
  string step_id = 1;
  mycel.common.v1.InferenceRef inference = 2;
}

message ValidateGraphProcedureRequest {
  string domain_id = 1;
  string procedure_json = 2;
}

message ValidateGraphProcedureResponse {
  bool valid = 1;
  string error = 2;
  string normalized_procedure_json = 3;
}

message CreateGraphProcedureRequest {
  string domain_id = 1;
  string procedure_json = 2;
}

message UpdateGraphProcedureRequest {
  string domain_id = 1;
  string procedure_id = 2;
  string procedure_json = 3;
}

message DeleteGraphProcedureRequest {
  string domain_id = 1;
  string procedure_id = 2;
}

message DeleteGraphProcedureResponse {}

message GetGraphProcedureRequest {
  string domain_id = 1;
  string procedure_id = 2;
}

message ListGraphProceduresRequest {
  string domain_id = 1;
  string status = 2;
}

message ListGraphProceduresResponse {
  repeated GraphProcedureSummary procedures = 1;
}

message CreateGraphProcedureResponse {
  string procedure_json = 1;
}

message UpdateGraphProcedureResponse {
  string procedure_json = 1;
}

message GetGraphProcedureResponse {
  string procedure_json = 1;
}

message ValidateGraphAutomationBindingRequest {
  string domain_id = 1;
  string binding_json = 2;
}

message ValidateGraphAutomationBindingResponse {
  bool valid = 1;
  string error = 2;
  string normalized_binding_json = 3;
}

message CreateGraphAutomationBindingRequest {
  string domain_id = 1;
  string binding_json = 2;
}

message UpdateGraphAutomationBindingRequest {
  string domain_id = 1;
  string binding_id = 2;
  string binding_json = 3;
}

message DeleteGraphAutomationBindingRequest {
  string domain_id = 1;
  string binding_id = 2;
}

message DeleteGraphAutomationBindingResponse {}

message GetGraphAutomationBindingRequest {
  string domain_id = 1;
  string binding_id = 2;
}

message ListGraphAutomationBindingsRequest {
  string domain_id = 1;
  string status = 2;
}

message ListGraphAutomationBindingsResponse {
  repeated GraphAutomationBindingSummary bindings = 1;
}

message EnableGraphAutomationBindingRequest {
  string domain_id = 1;
  string binding_id = 2;
}

message DisableGraphAutomationBindingRequest {
  string domain_id = 1;
  string binding_id = 2;
}

message CreateGraphAutomationBindingResponse {
  string binding_json = 1;
}

message UpdateGraphAutomationBindingResponse {
  string binding_json = 1;
}

message GetGraphAutomationBindingResponse {
  string binding_json = 1;
}

message EnableGraphAutomationBindingResponse {
  string binding_json = 1;
}

message DisableGraphAutomationBindingResponse {
  string binding_json = 1;
}
