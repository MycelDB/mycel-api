syntax = "proto3";

package mycel.common.v1;

import "google/protobuf/struct.proto";

// InferenceOperation identifies the workload operation requested and governed
// by Intelligence Access grants, policies, decisions, and usage telemetry.
enum InferenceOperation {
  INFERENCE_OPERATION_UNSPECIFIED = 0;
  INFERENCE_OPERATION_EMBEDDINGS = 1;
  INFERENCE_OPERATION_CHAT = 2;
  INFERENCE_OPERATION_RERANK = 3;
  INFERENCE_OPERATION_SUMMARIZE = 4;
  INFERENCE_OPERATION_CLASSIFY = 5;
  INFERENCE_OPERATION_IMAGE_ANALYSIS = 6;
}

// InferenceModelKind identifies the broad category of a model independent of
// the workload operations exposed by endpoint capabilities.
enum InferenceModelKind {
  INFERENCE_MODEL_KIND_UNSPECIFIED = 0;
  INFERENCE_MODEL_KIND_GENERATIVE = 1;
  INFERENCE_MODEL_KIND_EMBEDDING = 2;
  INFERENCE_MODEL_KIND_RERANKER = 3;
}

// InferencePrivacyClass describes where data is allowed to flow.
enum InferencePrivacyClass {
  INFERENCE_PRIVACY_CLASS_UNSPECIFIED = 0;
  INFERENCE_PRIVACY_CLASS_LOCAL_ONLY = 1;
  INFERENCE_PRIVACY_CLASS_PRIVATE = 2;
  INFERENCE_PRIVACY_CLASS_THIRD_PARTY = 3;
}

// InferenceNetworkClass describes the network boundary of an endpoint.
enum InferenceNetworkClass {
  INFERENCE_NETWORK_CLASS_UNSPECIFIED = 0;
  INFERENCE_NETWORK_CLASS_LOCAL = 1;
  INFERENCE_NETWORK_CLASS_PRIVATE_NETWORK = 2;
  INFERENCE_NETWORK_CLASS_PUBLIC_INTERNET = 3;
}

// InferenceParameters contains provider-neutral runtime parameters.
message InferenceParameters {
  optional double temperature = 1;
  int32 max_input_tokens = 2;
  int32 max_output_tokens = 3;
  string response_format = 4;
  google.protobuf.Struct metadata = 5;
}

// InferencePrivacyRequirement constrains candidate endpoint selection.
message InferencePrivacyRequirement {
  repeated InferencePrivacyClass allowed_privacy_classes = 1;
  bool require_local_endpoint = 2;
  bool disallow_third_party = 3;
}

// InferenceRef is the stable reference used by workloads such as automations.
message InferenceRef {
  InferenceOperation operation = 1;
  string profile = 2;
  string profile_id = 3;
  string capability = 4;
  string capability_id = 5;
  string endpoint = 6;
  string endpoint_id = 7;
  string model = 8;
  string model_id = 9;
  InferenceParameters parameters = 10;
}
