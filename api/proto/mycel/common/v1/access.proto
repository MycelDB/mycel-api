syntax = "proto3";

package mycel.common.v1;

import "google/protobuf/timestamp.proto";


// Principal identifies an actor that can own resources or receive access.
//
// Principal types describe the actor shape. Administration is represented by
// roles and capabilities, not by a separate operator identity species.
message Principal {
  PrincipalType type = 1;
  string id = 2;

  // Optional display label for user interfaces. This field is informational and
  // must not be used for authorization decisions.
  string display_name = 3;
}

enum PrincipalType {
  reserved 1, 3;
  reserved "PRINCIPAL_TYPE_USER", "PRINCIPAL_TYPE_OPERATOR";

  PRINCIPAL_TYPE_UNSPECIFIED = 0;
  PRINCIPAL_TYPE_SYSTEM = 2;
  PRINCIPAL_TYPE_HUMAN = 4;
  PRINCIPAL_TYPE_SERVICE = 5;
}

// Capability is the unit the daemon enforces for authorization decisions.
// Roles are convenience bundles that expand to these capabilities.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;

  // Space capabilities.
  CAPABILITY_SPACE_READ = 1;
  CAPABILITY_SPACE_UPDATE = 2;
  CAPABILITY_SPACE_MANAGE_ACCESS = 3;
  CAPABILITY_SPACE_ARCHIVE = 4;
  CAPABILITY_SPACE_DELETE = 5;
  CAPABILITY_SPACE_CREATE = 6;

  // Domain capabilities.
  CAPABILITY_DOMAIN_READ = 20;
  CAPABILITY_DOMAIN_CREATE = 21;
  CAPABILITY_DOMAIN_UPDATE = 22;
  CAPABILITY_DOMAIN_DELETE = 23;

  // Graph capabilities.
  CAPABILITY_GRAPH_READ = 40;
  CAPABILITY_GRAPH_WRITE = 41;
  CAPABILITY_GRAPH_DELETE = 42;

  CAPABILITY_TEMPLATE_READ = 60;
  CAPABILITY_TEMPLATE_MANAGE = 61;

  // Blob capabilities.
  CAPABILITY_BLOB_READ = 80;
  CAPABILITY_BLOB_WRITE = 81;
  CAPABILITY_BLOB_DELETE = 82;

  // Metadata capabilities.
  CAPABILITY_METADATA_READ = 100;
  CAPABILITY_METADATA_WRITE = 101;

  // Query and semantic capabilities.
  CAPABILITY_QUERY_RUN = 120;
  CAPABILITY_SEMANTIC_SEARCH = 121;
  CAPABILITY_SEMANTIC_MANAGE = 122;

  reserved 140 to 143, 146;
  reserved "CAPABILITY_USER_CREATE", "CAPABILITY_USER_MANAGE", "CAPABILITY_OPERATOR_CREATE", "CAPABILITY_OPERATOR_MANAGE", "CAPABILITY_USER_SESSION_DELEGATE";

  // Identity/control-plane capabilities.
  CAPABILITY_DAEMON_CONFIGURE = 144;
  CAPABILITY_MESH_MANAGE = 145;
  CAPABILITY_IDENTITY_PRINCIPAL_READ = 147;
  CAPABILITY_IDENTITY_PRINCIPAL_CREATE = 148;
  CAPABILITY_IDENTITY_PRINCIPAL_UPDATE = 149;
  CAPABILITY_IDENTITY_CREDENTIAL_SET = 150;
  CAPABILITY_IDENTITY_SESSION_DELEGATE = 151;
  CAPABILITY_IDENTITY_SESSION_MANAGE = 152;
  CAPABILITY_IDENTITY_GRANT_MANAGE = 153;

  // System capabilities used by daemon/system internals.
  CAPABILITY_SYSTEM_COMPACT_SPACE = 160;
  CAPABILITY_SYSTEM_MAINTAIN_SPACE = 161;
  CAPABILITY_SYSTEM_BACKUP_SPACE = 162;
  CAPABILITY_SYSTEM_REPLICATE_ACCESS = 163;

  // Inference capabilities.
  CAPABILITY_INFERENCE_CATALOG_READ = 180;
  CAPABILITY_INFERENCE_CATALOG_MANAGE = 181;
  CAPABILITY_INFERENCE_PROFILE_READ = 182;
  CAPABILITY_INFERENCE_PROFILE_MANAGE = 183;
  CAPABILITY_INFERENCE_CREDENTIAL_READ = 184;
  CAPABILITY_INFERENCE_CREDENTIAL_MANAGE = 185;
  CAPABILITY_INFERENCE_GRANT_MANAGE = 186;
  CAPABILITY_INFERENCE_POLICY_MANAGE = 187;
  CAPABILITY_INFERENCE_AUDIT_READ = 188;
  CAPABILITY_INFERENCE_INVOKE = 189;

  // Automation capabilities.
  CAPABILITY_AUTOMATION_READ = 200;
  CAPABILITY_AUTOMATION_MANAGE = 201;
  CAPABILITY_AUTOMATION_RUN = 202;
  CAPABILITY_AUTOMATION_WORKER = 203;

  // Cluster read-only capability.
  CAPABILITY_CLUSTER_READ = 220;
}

// CapabilityBucket describes the broad context in which a capability is used.
// It is primarily descriptive; the daemon still enforces concrete Capability
// values.
enum CapabilityBucket {
  CAPABILITY_BUCKET_UNSPECIFIED = 0;
  CAPABILITY_BUCKET_USER = 1;
  CAPABILITY_BUCKET_ADMIN = 2;
  CAPABILITY_BUCKET_SYSTEM = 3;
}

// AccessScope describes the scope at which access is evaluated or granted.
//
// v1 grants are generally space-scoped. Domain and finer-grained scopes are
// included to keep protobuf evolution straightforward as the daemon API grows.
message AccessScope {
  AccessScopeType type = 1;
  optional string space_id = 2;
  optional string domain_id = 3;
}

enum AccessScopeType {
  ACCESS_SCOPE_TYPE_UNSPECIFIED = 0;
  ACCESS_SCOPE_TYPE_SYSTEM = 1;
  ACCESS_SCOPE_TYPE_SPACE = 2;
  ACCESS_SCOPE_TYPE_DOMAIN = 3;
}

// SpaceRole is a built-in role preset. Roles simplify common grants but are not
// the authorization source of truth; effective capabilities are authoritative.
enum SpaceRole {
  SPACE_ROLE_UNSPECIFIED = 0;
  SPACE_ROLE_OWNER = 1;
  SPACE_ROLE_ADMIN = 2;
  SPACE_ROLE_WRITER = 3;
  SPACE_ROLE_READER = 4;
}

// EffectiveAccess reports the roles and capabilities currently effective for a
// caller in a given response context. Clients may use this for UI decisions, but
// the daemon must still enforce authorization on every request.
message EffectiveAccess {
  repeated SpaceRole roles = 1;
  repeated Capability capabilities = 2;
}

// AccessGrant is a design-level representation of an access grant. Initial v1
// client APIs mostly report effective access; future admin APIs may expose grant
// management using this shape or a refined version of it.
message AccessGrant {
  string access_grant_id = 1;
  Principal principal = 2;
  AccessScope scope = 3;
  repeated SpaceRole roles = 4;
  repeated Capability capabilities = 5;
  google.protobuf.Timestamp create_time = 6;
  google.protobuf.Timestamp update_time = 7;
}
