    url: https://github.com/MycelDB/mycel/issues
    about: File daemon implementation or CLI issues in mycel when the API contract is not the source of the problem.
  - name: Mycel Go SDK
    url: https://github.com/MycelDB/mycel-go-sdk/issues
    about: File Go SDK issues in mycel-go-sdk when the API contract is not the source of the problem.
  - name: Mycel Rust SDK
    url: https://github.com/MycelDB/mycel-rust-sdk/issues
